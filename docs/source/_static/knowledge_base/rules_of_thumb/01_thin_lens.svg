<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Thin-lens imaging  —  1/s + 1/s' = 1/f</text>
  <text x="360" y="40" text-anchor="middle" class="sub">object → lens → image    (positive distances measured from the lens)</text>
  <line x1="40" y1="200" x2="680" y2="200" class="axis"/>
  <path d="M 380 110 C 372 155.0, 372 245.0, 380 290 C 388 245.0, 388 155.0, 380 110 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="374,113 380,104 386,113" fill="#0ea5e9"/>
  <polygon points="374,287 380,296 386,287" fill="#0ea5e9"/>
  <circle cx="310" cy="200" r="3" fill="#0f766e"/>
  <text x="310" y="218" text-anchor="middle" class="lbl">F</text>
  <circle cx="450" cy="200" r="3" fill="#0f766e"/>
  <text x="450" y="218" text-anchor="middle" class="lbl">F'</text>
  <line x1="130" y1="200" x2="130" y2="140" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="122" y="136" text-anchor="end" class="lblb">y</text>
  <line x1="477.2" y1="200" x2="477.2" y2="223.3" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="485.2" y="237.3" class="lblb">y'</text>
  <path d="M 130 140 L 380 140 L 477.2 223.3" class="ray"/>
  <path d="M 130 140 L 477.2 223.3" class="rayA"/>
  <path d="M 130 140 L 380 223.3 L 477.2 223.3" class="ray"/>
  <line x1="130" y1="305" x2="380" y2="305" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="255" y="320" text-anchor="middle" class="lblb">s</text>
  <line x1="380" y1="305" x2="477.2" y2="305" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="429" y="320" text-anchor="middle" class="lblb">s'</text>
  <text x="360" y="350" text-anchor="middle" class="sub">m = y'/y = −s'/s    (sign keeps the inverted-image convention)</text>
</svg>
