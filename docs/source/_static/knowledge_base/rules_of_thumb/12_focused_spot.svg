<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Focused spot  2 w_f ≈ (4 λ / π) · (f / D)  =  (4/π) · λ · N</text>
  <text x="360" y="40" text-anchor="middle" class="sub">tightest focus when D fills the lens aperture (D = w_in beam diameter on lens)</text>
  <line x1="40" y1="200" x2="680" y2="200" class="axis"/>
  <path d="M 280 125 C 272 162.5, 272 237.5, 280 275 C 288 237.5, 288 162.5, 280 125 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="274,128 280,119 286,128" fill="#0ea5e9"/>
  <polygon points="274,272 280,281 286,272" fill="#0ea5e9"/>
  <line x1="60" y1="135" x2="280" y2="135" class="env"/>
  <line x1="60" y1="265" x2="280" y2="265" class="env"/>
  <line x1="60" y1="135" x2="60" y2="265" stroke="#b45309" stroke-width="1" marker-end="url(#arrEnv)" marker-start="url(#arrEnv)"/>
  <text x="50" y="204" text-anchor="end" class="lblb" fill="#b45309">D</text>
  <polygon points="280,135 495,196 495,204 280,265" fill="#b45309" fill-opacity="0.18" stroke="#b45309"/>
  <ellipse cx="500" cy="200" rx="6" ry="6" fill="#0f766e"/>
  <text x="514" y="204" class="lblb">2 w_f</text>
  <line x1="280" y1="310" x2="500" y2="310" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="390" y="325" text-anchor="middle" class="lblb">f</text>
  <text x="360" y="350" text-anchor="middle" class="sub">depth of focus  2 z_R = 2 π w_f² / λ           Power density  I_0 = 2 P / (π w_f²)</text>
</svg>
