<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Diffraction limit:  d_Airy = 2.44 λ N</text>
  <text x="360" y="40" text-anchor="middle" class="sub">Rayleigh-resolvable angular separation  Δθ = 1.22 λ / D</text>
  <circle cx="220" cy="220" r="70" fill="#1d4ed8" fill-opacity="0.16" stroke="#1d4ed8"/>
  <circle cx="220" cy="220" r="35" fill="#1d4ed8" fill-opacity="0.35"/>
  <circle cx="220" cy="220" r="3" fill="#0f766e"/>
  <line x1="150" y1="306" x2="290" y2="306" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="220" y="322" text-anchor="middle" class="lblb">d = 2.44 λ N</text>
  <text x="220" y="340" text-anchor="middle" class="sub">first dark ring</text>
  <circle cx="500" cy="160" r="22" fill="#1d4ed8" fill-opacity="0.3"/>
  <circle cx="546" cy="160" r="22" fill="#1d4ed8" fill-opacity="0.3"/>
  <text x="523" y="125" text-anchor="middle" class="lblb">resolved</text>
  <circle cx="514" cy="255" r="22" fill="#1d4ed8" fill-opacity="0.3"/>
  <circle cx="530" cy="255" r="22" fill="#1d4ed8" fill-opacity="0.3"/>
  <text x="523" y="300" text-anchor="middle" class="lblb">not resolved</text>
  <text x="360" y="345" text-anchor="middle" class="sub">λ = 0.55 µm:  N = 2 → d ≈ 2.7 µm    N = 8 → d ≈ 10.7 µm    N = 22 → d ≈ 29 µm</text>
</svg>
