<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Two thin lenses, separation d:    1/f = 1/f₁ + 1/f₂ − d / (f₁ f₂)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">P = P₁ + P₂ − d P₁ P₂        (powers add, then subtract the gap term)</text>
  <line x1="40" y1="200" x2="680" y2="200" class="axis"/>
  <path d="M 220 130 C 212 165.0, 212 235.0, 220 270 C 228 235.0, 228 165.0, 220 130 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="214,133 220,124 226,133" fill="#0ea5e9"/>
  <polygon points="214,267 220,276 226,267" fill="#0ea5e9"/>
  <path d="M 460 130 C 452 165.0, 452 235.0, 460 270 C 468 235.0, 468 165.0, 460 130 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="454,133 460,124 466,133" fill="#0ea5e9"/>
  <polygon points="454,267 460,276 466,267" fill="#0ea5e9"/>
  <text x="220" y="112" text-anchor="middle" class="lblb">f₁</text>
  <text x="460" y="112" text-anchor="middle" class="lblb">f₂</text>
  <line x1="220" y1="290" x2="460" y2="290" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="340" y="305" text-anchor="middle" class="lblb">d</text>
  <line x1="60" y1="160" x2="220" y2="160" class="ray"/>
  <line x1="60" y1="200" x2="220" y2="200" class="ray"/>
  <line x1="60" y1="240" x2="220" y2="240" class="ray"/>
  <line x1="220" y1="160" x2="460" y2="220.0" class="ray"/>
  <line x1="220" y1="200" x2="460" y2="200.0" class="ray"/>
  <line x1="220" y1="240" x2="460" y2="180.0" class="ray"/>
  <line x1="460" y1="220.0" x2="550" y2="200" class="ray"/>
  <line x1="460" y1="200.0" x2="550" y2="200" class="ray"/>
  <line x1="460" y1="180.0" x2="550" y2="200" class="ray"/>
  <circle cx="550" cy="200" r="3" fill="#0f766e"/>
  <text x="550" y="188" text-anchor="middle" class="lbl">F' (combined)</text>
  <text x="360" y="345" text-anchor="middle" class="sub">d = 0 → 1/f = 1/f₁ + 1/f₂      d = f₁ + f₂ → afocal telescope, magnification M = −f₁/f₂</text>
</svg>
