<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .neg   { fill:#fecaca; stroke:#991b1b; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .cement{ stroke:#111; stroke-width:0.7; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="ttl">Tessar</text>

  <line x1="30" y1="170" x2="690" y2="170" class="ax"/>

  <!-- Front positive singlet -->
  <path d="M 166,115 L 174,115 A 140,140 0 0,1 174,225 L 166,225 A 140,140 0 0,1 166,115 Z" class="pos"/>

  <!-- Middle negative singlet -->
  <path d="M 250,115 L 270,115 A 180,180 0 0,0 270,225 L 250,225 A 180,180 0 0,0 250,115 Z" class="neg"/>

  <!-- Stop -->
  <line x1="350" y1="115" x2="350" y2="155" class="stop"/>
  <line x1="350" y1="185" x2="350" y2="225" class="stop"/>
  <text x="350" y="105" text-anchor="middle" class="label">aperture stop</text>

  <!-- Rear cemented doublet (neg | pos) -->
  <path d="M 456,115 L 464,115 A 130,130 0 0,1 464,225 L 456,225 A 130,130 0 0,1 456,115 Z" class="neg"/>
  <path d="M 460,115 L 464,115 A 130,130 0 0,1 464,225 L 460,225 Z" class="pos"/>
  <line x1="460" y1="115" x2="460" y2="225" class="cement"/>

  <!-- Element labels -->
  <text x="170" y="260" text-anchor="middle" class="label">positive crown</text>
  <text x="260" y="260" text-anchor="middle" class="label">negative flint</text>
  <text x="460" y="260" text-anchor="middle" class="label">cemented doublet</text>

  <!-- Annotation: highlight rear doublet -->
  <path d="M 600,140 Q 540,90 470,108" class="annot" marker-end="url(#arr)"/>
  <text x="605" y="135" class="annot-text">cemented doublet</text>
  <text x="605" y="151" class="annot-text">does the work of</text>
  <text x="605" y="167" class="annot-text">two singlets</text>

  <!-- Bottom note -->
  <text x="360" y="285" text-anchor="middle" class="annot-text">4 elements, 3 groups: +, −, (cemented +/−) ⇒ compact and inexpensive</text>

  <!-- Legend -->
  <rect x="30" y="300" width="14" height="10" class="pos"/>
  <text x="48" y="309" class="label">positive (converging)</text>
  <rect x="190" y="300" width="14" height="10" class="neg"/>
  <text x="208" y="309" class="label">negative (diverging)</text>
</svg>
