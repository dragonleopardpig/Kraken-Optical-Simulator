<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .neg   { fill:#fecaca; stroke:#991b1b; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .cement{ stroke:#111; stroke-width:0.7; }
      .dim   { stroke:#dc2626; stroke-width:1.4; fill:none; }
      .dim-text { fill:#dc2626; font-size:12px; font-weight:700; }
      .curved { stroke:#7c3aed; stroke-width:2; fill:none; stroke-dasharray:4,3; }
      .curved-text { fill:#7c3aed; font-size:12px; font-weight:700; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="ttl">Petzval</text>

  <line x1="30" y1="170" x2="690" y2="170" class="ax"/>

  <!-- Front cemented doublet (pos | neg) -->
  <path d="M 166,108 L 174,108 A 100,100 0 0,1 174,232 L 166,232 A 100,100 0 0,1 166,108 Z" class="pos"/>
  <path d="M 170,108 L 174,108 A 100,100 0 0,1 174,232 L 170,232 Z" class="neg"/>
  <line x1="170" y1="108" x2="170" y2="232" class="cement"/>

  <!-- Stop just behind front doublet -->
  <line x1="225" y1="115" x2="225" y2="155" class="stop"/>
  <line x1="225" y1="185" x2="225" y2="225" class="stop"/>
  <text x="225" y="105" text-anchor="middle" class="label">stop</text>

  <!-- Rear cemented doublet (pos | neg) — same orientation, far away -->
  <path d="M 466,108 L 474,108 A 100,100 0 0,1 474,232 L 466,232 A 100,100 0 0,1 466,108 Z" class="pos"/>
  <path d="M 470,108 L 474,108 A 100,100 0 0,1 474,232 L 470,232 Z" class="neg"/>
  <line x1="470" y1="108" x2="470" y2="232" class="cement"/>

  <!-- Group labels -->
  <text x="170" y="260" text-anchor="middle" class="label">cemented doublet</text>
  <text x="470" y="260" text-anchor="middle" class="label">cemented doublet</text>

  <!-- Wide separation dimension -->
  <line x1="190" y1="282" x2="450" y2="282" class="dim" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="320" y="300" text-anchor="middle" class="dim-text">wide air space between groups</text>

  <!-- Curved focal surface (Petzval field curvature):
       off-axis points focus CLOSER to the lens than on-axis points,
       so the surface bulges toward the image side (right). -->
  <path d="M 555,125 Q 580,170 555,215" class="curved"/>
  <text x="600" y="170" class="curved-text">curved</text>
  <text x="600" y="186" class="curved-text">focal surface</text>

  <!-- Top emphasis -->
  <text x="360" y="55" text-anchor="middle" class="annot-text">Two cemented doublets, widely separated, NO field flattener ⇒ strong field curvature ("swirly" bokeh)</text>
</svg>
