<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Nd:YAG pump absorption versus path length</title>
  <desc id="desc">Beer-law absorption curves for absorption coefficients of 8 and 4 inverse centimeters, with a ten millimeter rod selection.</desc>
  <defs>
    <style>
      .title { font: 700 25px sans-serif; fill: #163447; }
      .axis { stroke: #244b62; stroke-width: 2; }
      .grid { stroke: #d8e1e3; stroke-width: 1; }
      .tick { font: 14px sans-serif; fill: #294957; }
      .label { font: 600 17px sans-serif; fill: #163447; }
      .peak { stroke: #c0523e; stroke-width: 4; fill: none; }
      .fwhm { stroke: #35758b; stroke-width: 4; fill: none; }
      .select { stroke: #bd8525; stroke-width: 3; stroke-dasharray: 8 7; }
      .legend { font: 16px sans-serif; fill: #294957; }
    </style>
  </defs>
  <rect width="1100" height="560" fill="#fbfaf6"/>
  <text x="550" y="38" text-anchor="middle" class="title">Nd:YAG pump absorption: A = 1 − exp(−αL)</text>
  <g transform="translate(100,70)">
    <line x1="0" y1="410" x2="900" y2="410" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="410" class="axis"/>
    <g class="grid">
      <line x1="0" y1="328" x2="900" y2="328"/><line x1="0" y1="246" x2="900" y2="246"/>
      <line x1="0" y1="164" x2="900" y2="164"/><line x1="0" y1="82" x2="900" y2="82"/>
    </g>
    <g class="tick">
      <text x="-12" y="415" text-anchor="end">0%</text><text x="-12" y="333" text-anchor="end">20%</text>
      <text x="-12" y="251" text-anchor="end">40%</text><text x="-12" y="169" text-anchor="end">60%</text>
      <text x="-12" y="87" text-anchor="end">80%</text><text x="-12" y="5" text-anchor="end">100%</text>
      <text x="0" y="435" text-anchor="middle">0</text><text x="225" y="435" text-anchor="middle">2.5</text>
      <text x="450" y="435" text-anchor="middle">5</text><text x="675" y="435" text-anchor="middle">7.5</text>
      <text x="900" y="435" text-anchor="middle">10 mm</text>
    </g>
    <text x="450" y="475" text-anchor="middle" class="label">Crystal path length L</text>
    <text x="-70" y="205" text-anchor="middle" transform="rotate(-90 -70 205)" class="label">Absorbed fraction A</text>
    <path d="M0 410 C90 180 180 75 270 31 C450 2 675 0 900 0" class="peak"/>
    <path d="M0 410 C90 300 180 220 270 164 C450 57 675 13 900 6" class="fwhm"/>
    <line x1="900" y1="0" x2="900" y2="410" class="select"/>
    <circle cx="900" cy="1" r="6" fill="#c0523e"/><circle cx="900" cy="7.5" r="6" fill="#35758b"/>
    <text x="710" y="56" class="legend">L = 10 mm</text>
    <text x="620" y="92" class="legend" fill="#c0523e">α = 8 cm⁻¹: 99.97%</text>
    <text x="580" y="125" class="legend" fill="#35758b">α = 4 cm⁻¹: 98.17%</text>
  </g>
</svg>
