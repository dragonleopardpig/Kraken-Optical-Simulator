<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 6 — Chief and marginal rays</text>
  <text x="360" y="40" text-anchor="middle" class="sub">The chief ray crosses the axis at the stop, EP, and XP; the marginal ray grazes their edges.</text>
  <line x1="20" y1="180" x2="700" y2="180" class="axis"/>
  <text x="698" y="176" text-anchor="end" class="sub">optical axis</text>
  <ellipse cx="250" cy="180" rx="10" ry="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250" y="108" text-anchor="middle" class="lblb" fill="#1d4ed8">L₁</text>
  <ellipse cx="480" cy="180" rx="10" ry="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="480" y="108" text-anchor="middle" class="lblb" fill="#1d4ed8">L₂</text>
  <line x1="350" y1="138" x2="350" y2="168" class="stop"/>
  <line x1="350" y1="192" x2="350" y2="222" class="stop"/>
  <text x="350" y="238" text-anchor="middle" class="sub">stop</text>
  <line x1="160" y1="156" x2="160" y2="204" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" class="lblb" fill="#7c3aed">EP</text>
  <line x1="590" y1="156" x2="590" y2="204" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="150" text-anchor="middle" class="lblb" fill="#7c3aed">XP</text>
  <line x1="40" y1="180" x2="40" y2="125" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="196" text-anchor="middle" class="lbl">object</text>
  <line x1="40.0" y1="125.0" x2="250.0" y2="221.2" class="ray-g"/>
  <line x1="250.0" y1="221.2" x2="350.0" y2="180.0" class="ray-g"/>
  <line x1="350.0" y1="180.0" x2="480.0" y2="126.4" class="ray-g"/>
  <line x1="480.0" y1="126.4" x2="660.0" y2="214.1" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="106.0" cy="142.5" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="106.0" y="146.5" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <circle cx="160" cy="136" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="160" y="140" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <circle cx="590" cy="224" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="590" y="228" text-anchor="middle" class="lblb" fill="#92400e">4</text>
  <line x1="40.0" y1="180.0" x2="250.0" y2="159.7" class="ray-r"/>
  <line x1="250.0" y1="159.7" x2="350.0" y2="150.0" class="ray-r"/>
  <line x1="350.0" y1="150.0" x2="480.0" y2="162.6" class="ray-r"/>
  <line x1="480.0" y1="162.6" x2="660.0" y2="180.0" class="ray-r" marker-end="url(#arr-red)"/>
  <circle cx="145.0" cy="183.83870967741936" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="145.0" y="187.83870967741936" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <text x="20" y="322" class="lblb">Construction steps</text>
  <circle cx="28" cy="336" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="339.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">1</text>
  <text x="44" y="340" class="sub">Marginal ray (red): launched from the on-axis foot of the object, just grazes the edge of the stop.</text>
  <circle cx="28" cy="354" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="357.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">2</text>
  <text x="44" y="358" class="sub">Chief ray (green): launched from the edge of the field, passes through the centre of the stop.</text>
  <circle cx="28" cy="372" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="375.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">3</text>
  <text x="44" y="376" class="sub">Trace the chief ray back into object space; the axis crossing is the entrance pupil EP.</text>
  <circle cx="28" cy="390" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="393.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">4</text>
  <text x="44" y="394" class="sub">Trace the chief ray forward in image space; the axis crossing is the exit pupil XP.</text>
  <text x="20" y="416" class="lblb">Legend</text>
  <line x1="22" y1="430" x2="50" y2="430" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="56" y="434" class="sub">Marginal ray</text>
  <line x1="22" y1="446" x2="50" y2="446" stroke="#15803d" stroke-width="2.4"/>
  <text x="56" y="450" class="sub">Chief ray</text>
  <line x1="22" y1="462" x2="50" y2="462" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="56" y="466" class="sub">EP, XP (purple)</text>
</svg>
