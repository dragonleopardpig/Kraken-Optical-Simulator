<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 4 — Nodal points</text>
  <text x="360" y="40" text-anchor="middle" class="sub">A ray aimed at N emerges from N' parallel to itself (same slope).</text>
  <line x1="20" y1="180" x2="700" y2="180" class="axis"/>
  <text x="698" y="176" text-anchor="end" class="sub">optical axis</text>
  <rect x="230" y="90" width="240" height="180" rx="6" ry="6" class="sys"/>
  <text x="350.0" y="84" text-anchor="middle" class="sub" font-style="italic">optical system</text>
  <line x1="290" y1="100" x2="290" y2="260" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="290" y="94" text-anchor="middle" class="pp-l" fill="#0f766e">P = N</text>
  <line x1="410" y1="100" x2="410" y2="260" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="410" y="94" text-anchor="middle" class="pp-l" fill="#0f766e">P' = N'</text>
  <line x1="40.0" y1="260.0" x2="290.0" y2="180.0" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="100" cy="248.0" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="100" y="252.0" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <line x1="410.0" y1="180.0" x2="690.0" y2="90.4" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="530" cy="129.6" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="530" y="133.6" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <line x1="290.0" y1="180.0" x2="410.0" y2="180.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="350.0" cy="208" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="350.0" y="212" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <circle cx="290" cy="180" r="4" fill="#15803d" stroke="white" stroke-width="1.5"/>
  <text x="290" y="210" text-anchor="middle" class="lblb" fill="#15803d">N</text>
  <circle cx="410" cy="180" r="4" fill="#15803d" stroke="white" stroke-width="1.5"/>
  <text x="410" y="210" text-anchor="middle" class="lblb" fill="#15803d">N'</text>
  <text x="20" y="322" class="lblb">Construction steps</text>
  <circle cx="28" cy="336" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="339.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">1</text>
  <text x="44" y="340" class="sub">Aim a ray at N (front nodal point).</text>
  <circle cx="28" cy="354" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="357.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">2</text>
  <text x="44" y="358" class="sub">It emerges from N' with the same slope (unit angular magnification).</text>
  <circle cx="28" cy="372" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="375.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">3</text>
  <text x="44" y="376" class="sub">Inside the system the ray is translated, not deviated — that is the defining property.</text>
  <text x="20" y="398" class="lblb">Legend</text>
  <line x1="22" y1="412" x2="50" y2="412" stroke="#15803d" stroke-width="2.4"/>
  <text x="56" y="416" class="sub">Step rays (green)</text>
  <line x1="22" y1="428" x2="50" y2="428" stroke="#6b7280" stroke-width="2.4"/>
  <text x="56" y="432" class="sub">Translation segment N → N'</text>
  <line x1="22" y1="444" x2="50" y2="444" stroke="#0f766e" stroke-width="2.4"/>
  <text x="56" y="448" class="sub">Nodal/principal pair (teal dashed)</text>
</svg>
