<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 3 — Locating F and P</text>
  <text x="360" y="40" text-anchor="middle" class="sub">Find F by sending a ray that emerges parallel to the axis; extensions locate P.</text>
  <line x1="20" y1="180" x2="700" y2="180" class="axis"/>
  <text x="698" y="176" text-anchor="end" class="sub">optical axis</text>
  <rect x="230" y="90" width="240" height="180" rx="6" ry="6" class="sys"/>
  <text x="350.0" y="84" text-anchor="middle" class="sub" font-style="italic">optical system</text>
  <line x1="130.0" y1="180.0" x2="290.0" y2="120.0" class="ray-b" marker-end="url(#arr-blue)"/>
  <circle cx="190" cy="150.0" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="190" y="154.0" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <line x1="470.0" y1="120.0" x2="690.0" y2="120.0" class="ray-b" marker-end="url(#arr-blue)"/>
  <circle cx="570" cy="102" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="570" y="106" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <line x1="290.0" y1="120.0" x2="500.0" y2="41.2" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="470.0" y1="120.0" x2="260.0" y2="120.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="290" cy="102" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="290" y="106" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <line x1="290" y1="100" x2="290" y2="260" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="290" y="94" text-anchor="middle" class="pp-l" fill="#0f766e">P</text>
  <circle cx="130" cy="180" r="4" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
  <text x="130" y="198" text-anchor="middle" class="lblb" fill="#1d4ed8">F</text>
  <line x1="130" y1="270" x2="290" y2="270" stroke="#111827" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="210.0" y="284" text-anchor="middle" class="lbl">f = front effective focal length</text>
  <text x="20" y="322" class="lblb">Construction steps</text>
  <circle cx="28" cy="336" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="339.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">1</text>
  <text x="44" y="340" class="sub">Any ray leaving F (front focal point) emerges from the system parallel to the axis.</text>
  <circle cx="28" cy="354" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="357.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">2</text>
  <text x="44" y="358" class="sub">Identify such an emergent ray on the image side at height h.</text>
  <circle cx="28" cy="372" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="375.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">3</text>
  <text x="44" y="376" class="sub">Dashed extensions meet at height h on the front principal plane P.</text>
  <text x="20" y="398" class="lblb">Legend</text>
  <line x1="22" y1="412" x2="50" y2="412" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="56" y="416" class="sub">Step rays (blue)</text>
  <line x1="22" y1="428" x2="50" y2="428" stroke="#6b7280" stroke-width="2.4"/>
  <text x="56" y="432" class="sub">Dashed construction extensions</text>
  <line x1="22" y1="444" x2="50" y2="444" stroke="#0f766e" stroke-width="2.4"/>
  <text x="56" y="448" class="sub">Principal plane P (dashed teal)</text>
</svg>
