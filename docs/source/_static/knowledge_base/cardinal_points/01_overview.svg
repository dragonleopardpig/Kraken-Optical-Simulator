<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 1 — Cardinal points of a centred optical system</text>
  <text x="360" y="40" text-anchor="middle" class="sub">Six axial points (F, P, N, N', P', F') summarise the system's first-order behaviour.</text>
  <line x1="20" y1="180" x2="700" y2="180" class="axis"/>
  <text x="698" y="176" text-anchor="end" class="sub">optical axis</text>
  <rect x="230" y="90" width="240" height="180" rx="6" ry="6" class="sys"/>
  <text x="350.0" y="84" text-anchor="middle" class="sub" font-style="italic">optical system</text>
  <line x1="290" y1="100" x2="290" y2="260" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="290" y="94" text-anchor="middle" class="pp-l" fill="#0f766e">P</text>
  <line x1="410" y1="100" x2="410" y2="260" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="410" y="94" text-anchor="middle" class="pp-l" fill="#0f766e">P'</text>
  <circle cx="130" cy="180" r="4" fill="#b91c1c" stroke="white" stroke-width="1.5"/>
  <text x="130" y="198" text-anchor="middle" class="lblb" fill="#b91c1c">F</text>
  <circle cx="570" cy="180" r="4" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
  <text x="570" y="198" text-anchor="middle" class="lblb" fill="#1d4ed8">F'</text>
  <circle cx="290" cy="180" r="5" fill="white" stroke="#15803d" stroke-width="2"/>
  <text x="276" y="206" text-anchor="middle" class="lblb" fill="#15803d">N</text>
  <circle cx="410" cy="180" r="5" fill="white" stroke="#15803d" stroke-width="2"/>
  <text x="424" y="206" text-anchor="middle" class="lblb" fill="#15803d">N'</text>
  <line x1="290" y1="80" x2="130" y2="80" stroke="#111827" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="210.0" y="74" text-anchor="middle" class="lbl">f (front focal length)</text>
  <line x1="410" y1="80" x2="570" y2="80" stroke="#111827" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="490.0" y="74" text-anchor="middle" class="lbl">f' (rear focal length)</text>
  <text x="20" y="322" class="lblb">Glossary</text>
  <line x1="22" y1="336" x2="50" y2="336" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="56" y="340" class="sub">F, F' — front / rear focal points (parallel-ray crossings)</text>
  <line x1="22" y1="352" x2="50" y2="352" stroke="#0f766e" stroke-width="2.4"/>
  <text x="56" y="356" class="sub">P, P' — front / rear principal planes (unit lateral magnification)</text>
  <line x1="22" y1="368" x2="50" y2="368" stroke="#15803d" stroke-width="2.4"/>
  <text x="56" y="372" class="sub">N, N' — front / rear nodal points (unit angular magnification)</text>
  <line x1="22" y1="384" x2="50" y2="384" stroke="#111827" stroke-width="2.4"/>
  <text x="56" y="388" class="sub">In air, N ≡ P and N' ≡ P'.</text>
</svg>
