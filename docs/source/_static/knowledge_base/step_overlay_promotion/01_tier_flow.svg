<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <style>
      .ttl    { fill:#111827; font-size:16px; font-weight:700; }
      .sub    { fill:#374151; font-size:11.5px; }
      .lbl    { fill:#111827; font-size:12px; }
      .lblb   { fill:#111827; font-size:13px; font-weight:700; }
      .mono   { fill:#1f2937; font-size:11px; font-family:'Courier New', monospace; }
      .arrlbl { fill:#1f2937; font-size:11px; font-family:'Courier New', monospace; font-weight:700; }
      .flow   { stroke:#111827; stroke-width:1.6; fill:none; }
      .flowd  { stroke:#111827; stroke-width:1.4; fill:none; stroke-dasharray:5,3; }
      .t1     { fill:#dbeafe; stroke:#1d4ed8; stroke-width:1.6; }
      .t2     { fill:#dcfce7; stroke:#16a34a; stroke-width:1.6; }
      .t3     { fill:#fef3c7; stroke:#b45309; stroke-width:1.6; }
      .step   { fill:#fee2e2; stroke:#b91c1c; stroke-width:1.4; }
      .note   { fill:#6b7280; font-size:10.5px; font-style:italic; }
      .pillbg { fill:#ffffff; stroke:#9ca3af; stroke-width:1; }
    </style>
  </defs>

  <text x="540" y="26" text-anchor="middle" class="ttl">STEP overlay promotion tiers — KrakenOS Open 3D pipeline</text>

  <!-- STEP file source -->
  <rect x="30" y="80" width="170" height="80" rx="8" class="step"/>
  <text x="115" y="106" text-anchor="middle" class="lblb">Imported STEP file</text>
  <text x="115" y="128" text-anchor="middle" class="sub">.step / .stp on disk</text>
  <text x="115" y="146" text-anchor="middle" class="sub">(vendor catalog)</text>

  <!-- Tier 1 box -->
  <rect x="320" y="60" width="280" height="140" rx="10" class="t1"/>
  <text x="460" y="86" text-anchor="middle" class="lblb">Tier 1 — STEP overlay</text>
  <text x="460" y="108" text-anchor="middle" class="mono">imported_optical_step_path slot</text>
  <text x="460" y="132" text-anchor="middle" class="lbl">visual mesh only</text>
  <text x="460" y="150" text-anchor="middle" class="lbl">STEP rotation handles</text>
  <text x="460" y="168" text-anchor="middle" class="lbl">no physics trace</text>
  <text x="460" y="188" text-anchor="middle" class="note">(Show Rays alone keeps it CAD)</text>

  <!-- Arrow STEP -> Tier 1 -->
  <path d="M200 120 L320 120" class="flow" marker-end="url(#arr)"/>
  <rect x="225" y="106" width="70" height="20" rx="4" class="pillbg"/>
  <text x="260" y="121" text-anchor="middle" class="arrlbl">import</text>

  <!-- Tier 2 box -->
  <rect x="720" y="60" width="320" height="140" rx="10" class="t2"/>
  <text x="880" y="86" text-anchor="middle" class="lblb">Tier 2 — STL optical solid</text>
  <text x="880" y="108" text-anchor="middle" class="sub">single SurfaceRow, file-backed</text>
  <text x="880" y="130" text-anchor="middle" class="mono">advanced["Solid_3d_stl"]</text>
  <text x="880" y="150" text-anchor="middle" class="mono">advanced["StepOverlayPromotion"]</text>
  <text x="880" y="172" text-anchor="middle" class="lbl">rays trace rotated triangles</text>
  <text x="880" y="190" text-anchor="middle" class="lbl">flip = 180° row tilt</text>

  <!-- Arrow Tier 1 -> Tier 2 with 2-line label pill above the arrow -->
  <path d="M600 130 L720 130" class="flow" marker-end="url(#arr)"/>
  <rect x="606" y="92" width="115" height="32" rx="5" class="pillbg"/>
  <text x="663" y="105" text-anchor="middle" class="arrlbl">promote_to_</text>
  <text x="663" y="118" text-anchor="middle" class="arrlbl">optical_solid_row()</text>

  <!-- Handles legend -->
  <rect x="30" y="190" width="270" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="44" y="207" class="lblb">Handles after the predicate fix</text>
  <rect x="44" y="214" width="12" height="10" class="t1"/>
  <text x="62" y="223" class="lbl">rotate (STEP)</text>
  <rect x="148" y="214" width="12" height="10" class="t2"/>
  <text x="166" y="223" class="lbl">placement</text>
  <rect x="232" y="214" width="12" height="10" class="t3"/>
  <text x="250" y="223" class="lbl">placement + Flip</text>

  <!-- Auto-preserve note -->
  <rect x="30" y="240" width="270" height="92" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="165" y="262" text-anchor="middle" class="lblb">Auto-preserve (Tier 2)</text>
  <text x="165" y="282" text-anchor="middle" class="sub">re-importing another STEP into the</text>
  <text x="165" y="296" text-anchor="middle" class="sub">same slot first promotes the old</text>
  <text x="165" y="310" text-anchor="middle" class="sub">overlay (clear_overlay=True), so</text>
  <text x="165" y="324" text-anchor="middle" class="sub">nothing is silently overwritten.</text>

  <!-- Dashed arrow from Auto-preserve up to Tier 2 -->
  <path d="M300 270 C 460 270 560 220 720 180" class="flowd" marker-end="url(#arr)"/>

  <!-- Tier 3 box -->
  <rect x="720" y="320" width="320" height="190" rx="10" class="t3"/>
  <text x="880" y="346" text-anchor="middle" class="lblb">Tier 3 — Native analytic</text>
  <text x="880" y="368" text-anchor="middle" class="sub">N SurfaceRows (one per face)</text>
  <text x="880" y="390" text-anchor="middle" class="lbl">sphere_exact, asphere fit</text>
  <text x="880" y="410" text-anchor="middle" class="mono">advanced["StepNativePromotion"]</text>
  <text x="880" y="430" text-anchor="middle" class="mono">row_indices links siblings</text>
  <text x="880" y="452" text-anchor="middle" class="lbl">rays trace prescription exactly</text>
  <text x="880" y="472" text-anchor="middle" class="lbl">flip = flip_rows() reverses + remaps</text>
  <text x="880" y="494" text-anchor="middle" class="note">needs user-supplied glass sequence</text>

  <!-- Arrow Tier 1 -> Tier 3 with label pill placed on the curve where it doesn't collide -->
  <path d="M600 180 C 700 220 700 340 720 380" class="flow" marker-end="url(#arr)"/>
  <rect x="320" y="250" width="280" height="32" rx="5" class="pillbg"/>
  <text x="460" y="263" text-anchor="middle" class="arrlbl">promote_to_native_surface_rows()</text>
  <text x="460" y="276" text-anchor="middle" class="note">(user supplies a glass/material sequence)</text>

  <!-- Tier 3 flip mechanics box -->
  <rect x="30" y="370" width="660" height="160" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="44" y="394" class="lblb">Tier 3 flip — flip_rows(indices)</text>
  <text x="44" y="416" class="lbl">1. Reverse the row order (back face becomes front).</text>
  <text x="44" y="434" class="lbl">2. Negate rc on every Standard row (sphere curvature direction flips).</text>
  <text x="44" y="452" class="lbl">3. Remap thicknesses: reversed(th[:-1]) + [th[-1]]   (last gap pinned).</text>
  <text x="44" y="470" class="lbl">4. Remap glasses identically; rename via _flipped_name.</text>
  <text x="44" y="498" class="note">Math lives in KrakenOS/UI/services/layout_table_workbench.py · flip_rows()</text>
  <text x="44" y="514" class="note">2D Flip menu and 3D Flip Lens both call this same primitive.</text>
</svg>
