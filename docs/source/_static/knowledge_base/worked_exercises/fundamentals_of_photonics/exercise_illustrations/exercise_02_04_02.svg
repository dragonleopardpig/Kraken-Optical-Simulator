  <text class="legend" x="65"><tspan x="65" y="462">Variables labeled on model — ρ: radial coordinate • z₁,z₂: surface positions • d(ρ): local thickness • d₀: central</tspan><tspan x="65" y="484">thickness • n: lens index • R₁,R₂: signed radii • f: focal length</tspan></text>
