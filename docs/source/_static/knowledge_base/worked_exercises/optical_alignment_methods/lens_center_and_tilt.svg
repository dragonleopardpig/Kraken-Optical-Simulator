<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Lens centering and tilt alignment</title><desc id="desc">Transmitted focus diagnoses lens decenter while a back-reflected spot diagnoses tilt.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#b44d3a;stroke-width:3;fill:none;stroke-dasharray:8 6}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:3}</style></defs>
  <rect width="1000" height="420" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Separate decenter from tilt</text><line x1="60" y1="210" x2="950" y2="210" stroke="#9db0b7" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M430 80Q390 210 430 340Q470 210 430 80z" class="lens"/><line x1="70" y1="210" x2="430" y2="210" class="b"/><line x1="430" y1="210" x2="720" y2="210" class="b"/><circle cx="720" cy="210" r="7" fill="#2d7188"/>
  <text x="620" y="175" text-anchor="middle" class="h">translation: focus onto axis</text>
  <line x1="430" y1="210" x2="115" y2="210" class="r"/><circle cx="115" cy="210" r="7" fill="#b44d3a"/><line x1="115" y1="90" x2="115" y2="275" stroke="#657d87" stroke-width="4"/>
  <text x="210" y="145" class="h">tip/tilt: overlap return with launch hole</text><text x="430" y="375" text-anchor="middle" class="l">translate x,y first; tip/tilt second; repeat</text>
</svg>
