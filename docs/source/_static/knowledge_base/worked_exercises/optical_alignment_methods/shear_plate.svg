<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Shear-plate collimation test</title><desc id="desc">A wedge produces sheared wavefront copies and diagnostic straight, tilted, or curved fringes.</desc>
  <defs><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b44d3a"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none}.front{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#ab)}.back{stroke:#b44d3a;stroke-width:3;fill:none;marker-end:url(#ar)}.inside{stroke:#b44d3a;stroke-width:2.5;fill:none}.edge{stroke:#7aa8b8;stroke-width:2;fill:none}.p{fill:#d8eef3;stroke:#2d7188;stroke-width:3}.f{stroke:#b44d3a;stroke-width:3}</style></defs>
  <rect width="1000" height="430" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Shear-plate collimation test</text>
  <line x1="55" y1="175" x2="450" y2="175" class="edge"/><line x1="55" y1="265" x2="360" y2="265" class="edge"/><line x1="55" y1="220" x2="405" y2="220" class="front"/>
  <path d="M325 300L465 160L489 182L350 326z" class="p"/><line x1="405" y1="220" x2="405" y2="95" class="front"/><path d="M405 220L442 231L430 195" class="inside"/><line x1="430" y1="195" x2="420" y2="95" class="back"/>
  <line x1="375" y1="95" x2="450" y2="95" stroke="#657d87" stroke-width="4"/><line x1="405" y1="125" x2="420" y2="125" stroke="#bd8525" stroke-width="2"/><line x1="405" y1="117" x2="405" y2="133" stroke="#bd8525" stroke-width="2"/><line x1="420" y1="117" x2="420" y2="133" stroke="#bd8525" stroke-width="2"/>
  <text x="412.5" y="148" text-anchor="middle" class="l">shear s</text><text x="397" y="78" text-anchor="end" class="l">front copy</text><text x="428" y="78" class="l">back copy</text><text x="250" y="365" class="l">front reflection plus refracted back-surface reflection</text>
  <rect x="570" y="70" width="120" height="230" rx="8" fill="#fff" stroke="#9db0b7"/><text x="630" y="330" text-anchor="middle" class="h">collimated</text>
  <g class="f"><line x1="590" y1="95" x2="590" y2="275"/><line x1="615" y1="95" x2="615" y2="275"/><line x1="640" y1="95" x2="640" y2="275"/><line x1="665" y1="95" x2="665" y2="275"/></g>
  <rect x="725" y="70" width="120" height="230" rx="8" fill="#fff" stroke="#9db0b7"/><text x="785" y="330" text-anchor="middle" class="h">defocused</text>
  <g class="f"><line x1="735" y1="110" x2="805" y2="275"/><line x1="755" y1="95" x2="825" y2="260"/><line x1="780" y1="95" x2="840" y2="235"/></g>
  <rect x="875" y="70" width="95" height="230" rx="8" fill="#fff" stroke="#9db0b7"/><text x="922" y="330" text-anchor="middle" class="h">aberrated</text>
  <g fill="none" class="f"><path d="M892 95Q940 180 892 275"/><path d="M915 95Q963 180 915 275"/><path d="M938 95Q980 180 938 275"/></g>
</svg>
