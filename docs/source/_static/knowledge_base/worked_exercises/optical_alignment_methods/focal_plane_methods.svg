<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Three focal-plane alignment methods</title><desc id="desc">Distant-object imaging, maximum speckle size, and objective back-focal-plane collimation diagnose focus.</desc>
  <defs><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:14px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:3}.panel{fill:#fffdf7;stroke:#9db0b7;stroke-width:2}</style></defs>
  <rect width="1100" height="470" fill="#fbfaf6"/><text x="550" y="38" text-anchor="middle" class="t">Convert defocus into a visible change</text>
  <g transform="translate(25,70)"><rect width="330" height="340" rx="10" class="panel"/><text x="165" y="32" text-anchor="middle" class="h">Distant object</text><line x1="30" y1="170" x2="305" y2="170" stroke="#9db0b7" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M45 130l35-40 35 40z" fill="#7aa66a"/><path d="M175 70Q150 170 175 270Q200 170 175 70z" class="lens"/><line x1="80" y1="90" x2="175" y2="90" class="b"/><line x1="175" y1="90" x2="285" y2="263" class="b"/><line x1="80" y1="90" x2="175" y2="170" class="b"/><line x1="175" y1="170" x2="285" y2="263" class="b"/><line x1="285" y1="85" x2="285" y2="275" stroke="#657d87" stroke-width="4"/><circle cx="285" cy="263" r="5" fill="#b44d3a"/><text x="165" y="305" text-anchor="middle" class="l">one point forms one inverted image</text></g>
  <g transform="translate(385,70)"><rect width="330" height="340" rx="10" class="panel"/><text x="165" y="32" text-anchor="middle" class="h">Speckle focus</text><path d="M75 70Q50 170 75 270Q100 170 75 70z" class="lens"/><path d="M75 100L225 170L75 240" class="b"/><line x1="225" y1="70" x2="225" y2="270" stroke="#657d87" stroke-width="5"/><g fill="#b44d3a"><circle cx="265" cy="120" r="13"/><circle cx="290" cy="170" r="17"/><circle cx="260" cy="225" r="14"/></g><text x="165" y="315" text-anchor="middle" class="l">largest grains: smallest illuminated patch</text></g>
  <g transform="translate(745,70)"><rect width="330" height="340" rx="10" class="panel"/><text x="165" y="32" text-anchor="middle" class="h">Objective BFP</text><circle cx="95" cy="170" r="7" fill="#b44d3a"/><path d="M180 65Q130 170 180 275Q230 170 180 65z" class="lens"/><line x1="95" y1="170" x2="180" y2="75" class="b"/><line x1="95" y1="170" x2="180" y2="265" class="b"/><line x1="180" y1="75" x2="300" y2="75" class="b"/><line x1="180" y1="265" x2="300" y2="265" class="b"/><text x="95" y="145" text-anchor="middle" class="l">BFP</text><text x="165" y="315" text-anchor="middle" class="l">smallest far-field growth: collimated output</text></g>
</svg>
