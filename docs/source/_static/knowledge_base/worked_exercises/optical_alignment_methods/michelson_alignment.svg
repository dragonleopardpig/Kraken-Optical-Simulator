<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Michelson interferometer alignment</title><desc id="desc">Two arms return through a beamsplitter and are compared at near and far observation planes.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#b44d3a;stroke-width:3;fill:none}.o{fill:#d8eef3;stroke:#2d7188;stroke-width:3}</style></defs>
  <rect width="1000" height="470" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Michelson: align each return, then overlap at two planes</text>
  <line x1="65" y1="235" x2="430" y2="235" class="b"/><rect x="410" y="195" width="80" height="80" transform="rotate(45 450 235)" class="o"/>
  <line x1="450" y1="235" x2="810" y2="235" class="b"/><line x1="810" y1="160" x2="810" y2="310" stroke="#244b62" stroke-width="9"/><text x="810" y="335" text-anchor="middle" class="l">M1</text>
  <line x1="450" y1="235" x2="450" y2="80" class="b"/><line x1="375" y1="80" x2="525" y2="80" stroke="#244b62" stroke-width="9"/><text x="545" y="85" class="l">M2</text>
  <path d="M810 245L450 245L450 420" class="r"/><path d="M460 80L460 235L460 420" class="r"/>
  <line x1="430" y1="350" x2="490" y2="350" stroke="#657d87" stroke-width="5"/><line x1="430" y1="420" x2="490" y2="420" stroke="#657d87" stroke-width="5"/><text x="510" y="355" class="l">near plane: position</text><text x="510" y="425" class="l">far plane: angle</text>
  <text x="240" y="215" text-anchor="middle" class="l">alignment laser</text>
</svg>
