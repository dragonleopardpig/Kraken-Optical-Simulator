<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Spatial-filter beam expander</title><desc id="desc">A Keplerian telescope focuses through a pinhole and expands a collimated laser beam.</desc>
  <defs><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:16px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none}.d{stroke:#748c96;stroke-width:2;stroke-dasharray:7 6}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:4}</style></defs>
  <rect width="1000" height="400" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Keplerian expansion with a shared focal plane</text>
  <path d="M300 80Q260 200 300 320Q340 200 300 80zM700 55Q635 200 700 345Q765 200 700 55z" class="lens"/>
  <line x1="70" y1="170" x2="300" y2="170" class="b"/><line x1="70" y1="230" x2="300" y2="230" class="b"/>
  <line x1="300" y1="170" x2="380" y2="200" class="b"/><line x1="300" y1="230" x2="380" y2="200" class="b"/>
  <circle cx="380" cy="200" r="8" fill="#b44d3a"/><line x1="380" y1="200" x2="700" y2="80" class="b"/><line x1="380" y1="200" x2="700" y2="320" class="b"/>
  <line x1="700" y1="80" x2="940" y2="80" class="b"/><line x1="700" y1="320" x2="940" y2="320" class="b"/>
  <text x="300" y="360" text-anchor="middle" class="l">L1, f1 = 25 mm</text><text x="380" y="180" text-anchor="middle" class="l">50 um pinhole</text><text x="700" y="360" text-anchor="middle" class="l">L2, f2 = 100 mm</text>
  <line x1="300" y1="375" x2="700" y2="375" class="d"/><text x="500" y="397" text-anchor="middle" class="l">drawn to 4:1 focal-length and diameter ratio</text>
</svg>
