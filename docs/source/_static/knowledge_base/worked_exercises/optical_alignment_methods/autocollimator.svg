<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Autocollimator surface alignment</title><desc id="desc">An unfolded ray diagram shows a reticle point at the objective focal plane becoming a collimated bundle. A tilted mirror returns the bundle at twice its tilt, and the objective focuses a displaced image.</desc>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b44d3a"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.s{font:13px sans-serif;fill:#506874}.out{stroke:#2d7188;stroke-width:3;fill:none}.outa{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#b)}.ret{stroke:#b44d3a;stroke-width:3;fill:none}.reta{stroke:#b44d3a;stroke-width:3;fill:none;marker-end:url(#r)}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:3}.box{fill:#e8f2f5;stroke:#35758b;stroke-width:2}.inset{fill:#fffdf7;stroke:#9db0b7;stroke-width:2}</style></defs>
  <rect width="1100" height="480" fill="#fbfaf6"/><text x="550" y="38" text-anchor="middle" class="t">Autocollimation converts surface tilt into image displacement</text>
  <rect x="45" y="72" width="325" height="315" rx="12" class="box"/><text x="170" y="101" text-anchor="middle" class="h">autocollimator (unfolded)</text>
  <line x1="130" y1="120" x2="130" y2="330" stroke="#657d87" stroke-width="4"/><text x="118" y="345" text-anchor="middle" class="s">reticle focal plane</text><path d="M112 205h36M130 187v36" stroke="#244b62" stroke-width="3"/><circle cx="130" cy="205" r="5" fill="#2d7188"/>
  <path d="M315 90Q275 210 315 330Q355 210 315 90z" class="lens"/><text x="315" y="365" text-anchor="middle" class="l">objective, focal length f_a</text>
  <path d="M130 205L315 155M130 205L315 255" class="out"/><line x1="315" y1="155" x2="797.4" y2="155" class="outa"/><line x1="315" y1="255" x2="802.6" y2="255" class="outa"/>
  <line x1="797.4" y1="155" x2="315" y2="205.7" class="ret"/><line x1="802.6" y1="255" x2="315" y2="305.7" class="ret"/><path d="M315 205.7L130 224.4M315 305.7L130 224.4" class="reta"/><circle cx="130" cy="224.4" r="5" fill="#b44d3a"/>
  <line x1="800" y1="95" x2="800" y2="320" stroke="#9db0b7" stroke-width="2" stroke-dasharray="7 6"/><line x1="794.8" y1="105" x2="805.2" y2="305" stroke="#244b62" stroke-width="9"/><path d="M800 115A38 38 0 0 1 798 116" fill="none" stroke="#bd8525" stroke-width="3"/><text x="720" y="100" class="l">surface tilt tau</text><text x="676" y="138" text-anchor="middle" class="s">outgoing parallel bundle</text><text x="585" y="330" text-anchor="middle" class="s" fill="#b44d3a">return angle changes by 2 tau</text>
  <rect x="865" y="90" width="205" height="270" rx="10" class="inset"/><text x="967.5" y="120" text-anchor="middle" class="h">focal-plane view</text><line x1="900" y1="205" x2="1015" y2="205" stroke="#9db0b7" stroke-width="2"/><line x1="945" y1="155" x2="945" y2="255" stroke="#9db0b7" stroke-width="2"/><path d="M927 190h36M945 172v36" stroke="#244b62" stroke-width="3"/><circle cx="945" cy="190" r="5" fill="#2d7188"/><path d="M927 230h36M945 212v36" stroke="#b44d3a" stroke-width="3"/><circle cx="945" cy="230" r="5" fill="#b44d3a"/><line x1="1000" y1="190" x2="1000" y2="230" stroke="#bd8525" stroke-width="2"/><path d="M994 197L1000 190L1006 197M994 223L1000 230L1006 223" fill="none" stroke="#bd8525" stroke-width="2"/><text x="1012" y="214" class="l">Delta x</text><text x="967.5" y="292" text-anchor="middle" class="s" fill="#2d7188">projected reticle</text><text x="967.5" y="315" text-anchor="middle" class="s" fill="#b44d3a">returned image</text><text x="967.5" y="342" text-anchor="middle" class="l">Delta x = 2 f_a tau</text>
  <text x="550" y="435" text-anchor="middle" class="l">Objective: angle to position. Reflection: surface tilt tau to beam angle 2 tau.</text>
</svg>
