<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Autocollimator surface alignment</title><desc id="desc">A projected reticle reflects from a tilted surface and returns displaced by twice the surface angle.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:16px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#b44d3a;stroke-width:3;fill:none;marker-end:url(#a)}.box{fill:#e8f2f5;stroke:#35758b;stroke-width:2}</style></defs>
  <rect width="1000" height="400" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Autocollimation: reflected angle is twice surface tilt</text>
  <rect x="65" y="105" width="210" height="180" rx="12" class="box"/><text x="170" y="140" text-anchor="middle" class="l">illuminated reticle</text><path d="M130 190h80M170 150v80" stroke="#244b62" stroke-width="4"/><path d="M245 135Q220 195 245 255" fill="#d8eef3" stroke="#2d7188" stroke-width="3"/>
  <line x1="260" y1="175" x2="780" y2="175" class="b"/><line x1="780" y1="175" x2="260" y2="235" class="r"/><line x1="774.5" y1="80.2" x2="785.5" y2="269.8" stroke="#244b62" stroke-width="9"/>
  <path d="M785 175A65 65 0 0 0 800 205" fill="none" stroke="#bd8525" stroke-width="3"/><text x="825" y="210" class="l">surface tilt tau</text><text x="500" y="325" text-anchor="middle" class="l">detector shift = 2 x focal length x surface tilt</text>
</svg>
