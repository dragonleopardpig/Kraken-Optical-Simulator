<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440" role="img" aria-labelledby="title desc">
  <title id="title">Plane-mirror and corner-cube return tests</title><desc id="desc">A plane mirror return measures surface normal while a corner cube produces an anti-parallel displaced return.</desc>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b44d3a"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 18px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.s{font:13px sans-serif;fill:#506874}.o{stroke:#2d7188;stroke-width:4;fill:none;marker-end:url(#b)}.q{stroke:#b44d3a;stroke-width:4;fill:none;marker-end:url(#r)}.i{stroke:#bd8525;stroke-width:3.5;fill:none;stroke-linejoin:round}.panel{fill:#fffdf7;stroke:#9db0b7;stroke-width:2}</style></defs>
  <rect width="1050" height="440" fill="#fbfaf6"/><text x="525" y="38" text-anchor="middle" class="t">Choose the return optic for the degree of freedom</text>
  <g transform="translate(25,70)"><rect width="485" height="320" rx="10" class="panel"/><text x="242" y="35" text-anchor="middle" class="h">Plane mirror: surface-normal test</text><line x1="55" y1="165" x2="410" y2="165" class="o"/><line x1="410" y1="165" x2="55" y2="115" class="q"/><line x1="416.3" y1="75.2" x2="403.7" y2="254.8" stroke="#244b62" stroke-width="9"/><line x1="55" y1="75" x2="55" y2="255" stroke="#657d87" stroke-width="5"/><text x="242" y="290" text-anchor="middle" class="l">return shift = 2 L times mirror tilt</text></g>
  <g transform="translate(540,70)"><rect width="485" height="320" rx="10" class="panel"/><text x="242" y="35" text-anchor="middle" class="h">Corner cube: anti-parallel return</text><line x1="55" y1="120" x2="365" y2="120" class="o"/><path d="M365 75L435 145L365 215z" fill="#d8eef3" stroke="#2d7188" stroke-width="4"/><path d="M365 120H410V170H365" class="i"/><path d="M388 114l12 6-12 6zM404 140l6 12 6-12zM398 164l-12 6 12 6z" fill="#bd8525"/><circle cx="410" cy="120" r="5" fill="#fffdf7" stroke="#bd8525" stroke-width="2"/><circle cx="410" cy="170" r="5" fill="#fffdf7" stroke="#bd8525" stroke-width="2"/><line x1="365" y1="170" x2="55" y2="170" class="q"/><line x1="55" y1="70" x2="55" y2="235" stroke="#657d87" stroke-width="5"/><text x="242" y="238" text-anchor="middle" class="s">2D section: third face acts out of plane</text><text x="242" y="275" text-anchor="middle" class="l">anti-parallel return with lateral offset</text><text x="242" y="300" text-anchor="middle" class="l">cube orientation is not a normal reference</text></g>
</svg>
