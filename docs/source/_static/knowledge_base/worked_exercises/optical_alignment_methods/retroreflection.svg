<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440" role="img" aria-labelledby="title desc">
  <title id="title">Plane-mirror and corner-cube return tests</title><desc id="desc">A plane mirror return measures surface normal while a corner cube produces an anti-parallel displaced return.</desc>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b44d3a"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 18px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.o{stroke:#2d7188;stroke-width:4;fill:none;marker-end:url(#b)}.q{stroke:#b44d3a;stroke-width:4;fill:none;marker-end:url(#r)}.panel{fill:#fffdf7;stroke:#9db0b7;stroke-width:2}</style></defs>
  <rect width="1050" height="440" fill="#fbfaf6"/><text x="525" y="38" text-anchor="middle" class="t">Choose the return optic for the degree of freedom</text>
  <g transform="translate(25,70)"><rect width="485" height="320" rx="10" class="panel"/><text x="242" y="35" text-anchor="middle" class="h">Plane mirror: surface-normal test</text><line x1="55" y1="165" x2="390" y2="165" class="o"/><line x1="390" y1="165" x2="55" y2="115" class="q"/><line x1="390" y1="75" x2="430" y2="255" stroke="#244b62" stroke-width="9"/><line x1="55" y1="75" x2="55" y2="255" stroke="#657d87" stroke-width="5"/><text x="242" y="290" text-anchor="middle" class="l">return shift = 2 L times mirror tilt</text></g>
  <g transform="translate(540,70)"><rect width="485" height="320" rx="10" class="panel"/><text x="242" y="35" text-anchor="middle" class="h">Corner cube: anti-parallel return</text><line x1="55" y1="145" x2="365" y2="145" class="o"/><path d="M365 75L430 145L365 215z" fill="#d8eef3" stroke="#2d7188" stroke-width="4"/><line x1="365" y1="195" x2="55" y2="195" class="q"/><line x1="55" y1="80" x2="55" y2="255" stroke="#657d87" stroke-width="5"/><text x="242" y="275" text-anchor="middle" class="l">parallel return, possible lateral offset</text><text x="242" y="300" text-anchor="middle" class="l">cube orientation is not a normal reference</text></g>
</svg>
