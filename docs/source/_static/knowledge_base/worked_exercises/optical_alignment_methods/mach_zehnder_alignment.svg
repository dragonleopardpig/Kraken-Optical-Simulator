<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Mach-Zehnder interferometer alignment</title><desc id="desc">Two separate forward arms recombine at a second beamsplitter and overlap at near and far screens.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#b44d3a;stroke-width:3;fill:none}.o{fill:#d8eef3;stroke:#2d7188;stroke-width:3}</style></defs>
  <rect width="1000" height="450" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Mach-Zehnder: close position and angle independently</text>
  <line x1="55" y1="225" x2="220" y2="225" class="b"/><rect x="205" y="190" width="70" height="70" transform="rotate(45 240 225)" class="o"/>
  <path d="M240 225L400 95L690 95L785 225" class="b"/><path d="M240 225L400 350L690 350L785 225" class="r"/>
  <line x1="370" y1="65" x2="430" y2="125" stroke="#244b62" stroke-width="9"/><line x1="370" y1="380" x2="430" y2="320" stroke="#244b62" stroke-width="9"/>
  <rect x="750" y="190" width="70" height="70" transform="rotate(45 785 225)" class="o"/><line x1="785" y1="225" x2="950" y2="225" class="b"/>
  <line x1="865" y1="165" x2="865" y2="285" stroke="#657d87" stroke-width="5"/><line x1="940" y1="165" x2="940" y2="285" stroke="#657d87" stroke-width="5"/><text x="865" y="312" text-anchor="middle" class="l">near</text><text x="940" y="312" text-anchor="middle" class="l">far</text>
  <text x="545" y="75" text-anchor="middle" class="l">block lower arm; align upper</text><text x="545" y="405" text-anchor="middle" class="l">block upper arm; align lower</text>
</svg>
