<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Dog-leg beam walking</title><desc id="desc">Two mirrors steer a beam through near and far irises by alternating position and angle corrections.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:16px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:4;fill:none;marker-end:url(#a)}.r{stroke:#b44d3a;stroke-width:3;fill:none;stroke-dasharray:8 6}.o{fill:#fff3d5;stroke:#bd8525;stroke-width:2}</style></defs>
  <rect width="1000" height="420" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Two-mirror dog leg: alternate near and far targets</text>
  <rect x="55" y="165" width="120" height="58" rx="10" class="o"/><text x="115" y="200" text-anchor="middle" class="l">laser</text>
  <line x1="175" y1="194" x2="300" y2="255" class="b"/><line x1="300" y1="255" x2="445" y2="125" class="b"/><line x1="445" y1="125" x2="910" y2="125" class="b"/>
  <line x1="270" y1="278" x2="330" y2="222" stroke="#244b62" stroke-width="9"/><line x1="415" y1="95" x2="475" y2="155" stroke="#244b62" stroke-width="9"/>
  <text x="300" y="315" text-anchor="middle" class="l">M1: restore near position</text><text x="445" y="82" text-anchor="middle" class="l">M2: correct outgoing angle</text>
  <line x1="650" y1="65" x2="650" y2="190" stroke="#657d87" stroke-width="5"/><circle cx="650" cy="125" r="10" fill="#fbfaf6" stroke="#244b62" stroke-width="3"/>
  <line x1="865" y1="65" x2="865" y2="190" stroke="#657d87" stroke-width="5"/><circle cx="865" cy="125" r="10" fill="#fbfaf6" stroke="#244b62" stroke-width="3"/>
  <text x="650" y="215" text-anchor="middle" class="l">near iris A1</text><text x="865" y="215" text-anchor="middle" class="l">far iris A2</text>
  <path d="M445 125L650 125L865 175" class="r"/><text x="780" y="278" text-anchor="middle" class="l">Repeat: M1 on A1, M2 on A2</text>
</svg>
