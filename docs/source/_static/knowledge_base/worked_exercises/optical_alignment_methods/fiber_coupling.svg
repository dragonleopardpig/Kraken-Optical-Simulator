<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Fiber-coupling alignment sequence</title><desc id="desc">A focusing lens launches into a fiber while a raster search and shrinking optimization converge on maximum power.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2d7188"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.b{stroke:#2d7188;stroke-width:3;fill:none;marker-end:url(#a)}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:3}</style></defs>
  <rect width="1000" height="430" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Fiber coupling: find, focus, shrink the search</text>
  <line x1="55" y1="145" x2="300" y2="145" class="b"/><line x1="55" y1="255" x2="300" y2="255" class="b"/><path d="M325 70Q285 200 325 330Q365 200 325 70z" class="lens"/><line x1="325" y1="145" x2="550" y2="200" class="b"/><line x1="325" y1="255" x2="550" y2="200" class="b"/>
  <rect x="550" y="120" width="55" height="160" rx="8" fill="#d9d3c3" stroke="#5d6d73" stroke-width="3"/><circle cx="550" cy="200" r="9" fill="#fff3d5" stroke="#bd8525" stroke-width="3"/><line x1="605" y1="200" x2="890" y2="200" stroke="#bd8525" stroke-width="6"/>
  <text x="325" y="365" text-anchor="middle" class="l">focus lens: x, y, z, tip, tilt</text><text x="710" y="185" text-anchor="middle" class="l">transmitted power is the merit function</text>
  <path d="M650 315h160v70H630v-90h200v110H610" fill="none" stroke="#b44d3a" stroke-width="3"/><text x="720" y="285" text-anchor="middle" class="h">coarse raster, then smaller scans</text>
</svg>
