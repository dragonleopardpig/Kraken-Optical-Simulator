<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Visible proxy for near-infrared alignment</title><desc id="desc">Visible and infrared beams share a mechanical axis but focus at different longitudinal positions.</desc>
  <defs><style>.t{font:700 24px sans-serif;fill:#15384a}.h{font:700 17px sans-serif;fill:#15384a}.l{font:15px sans-serif;fill:#294957}.v{stroke:#4f9b59;stroke-width:4;fill:none}.i{stroke:#b44d3a;stroke-width:4;fill:none;stroke-dasharray:9 6}.lens{fill:#d8eef3;stroke:#2d7188;stroke-width:3}</style></defs>
  <rect width="1000" height="420" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Visible light establishes geometry; NIR needs final verification</text>
  <line x1="60" y1="190" x2="940" y2="190" stroke="#9db0b7" stroke-width="2" stroke-dasharray="7 6"/><line x1="60" y1="130" x2="390" y2="130" class="v"/><line x1="60" y1="250" x2="390" y2="250" class="v"/>
  <line x1="60" y1="145" x2="390" y2="145" class="i"/><line x1="60" y1="235" x2="390" y2="235" class="i"/><path d="M415 65Q370 190 415 315Q460 190 415 65z" class="lens"/>
  <line x1="415" y1="130" x2="690" y2="190" class="v"/><line x1="415" y1="250" x2="690" y2="190" class="v"/><line x1="415" y1="145" x2="770" y2="190" class="i"/><line x1="415" y1="235" x2="770" y2="190" class="i"/>
  <line x1="690" y1="145" x2="690" y2="235" stroke="#4f9b59" stroke-width="4"/><line x1="770" y1="145" x2="770" y2="235" stroke="#b44d3a" stroke-width="4"/>
  <text x="650" y="275" class="h" fill="#4f9b59">visible focus</text><text x="755" y="305" class="h" fill="#b44d3a">NIR focus</text><text x="730" y="345" text-anchor="middle" class="l">same axis, chromatic longitudinal shift</text>
</svg>
