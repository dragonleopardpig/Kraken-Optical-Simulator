<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Two-iris optical-axis test</title><desc id="desc">A reference axis through two irises and a beam with angular error measured at the second iris.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b44d3a"/></marker><style>.t{font:700 24px sans-serif;fill:#15384a}.l{font:16px sans-serif;fill:#294957}.s{stroke:#2d7188;stroke-width:4;fill:none}.e{stroke:#b44d3a;stroke-width:4;fill:none}.d{stroke:#748c96;stroke-width:2;stroke-dasharray:7 6}.m{stroke:#b44d3a;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1000" height="360" fill="#fbfaf6"/><text x="500" y="38" text-anchor="middle" class="t">Two points define position and angle</text>
  <line x1="90" y1="190" x2="930" y2="190" class="s"/><text x="90" y="176" class="l">reference axis</text>
  <path d="M300 105v170M285 105v55M285 220v55M700 105v170M685 105v55M685 220v55" stroke="#244b62" stroke-width="5" fill="none"/>
  <circle cx="300" cy="190" r="9" fill="#fbfaf6" stroke="#244b62" stroke-width="3"/><circle cx="700" cy="190" r="9" fill="#fbfaf6" stroke="#244b62" stroke-width="3"/>
  <text x="300" y="302" text-anchor="middle" class="l">A1: position</text><text x="700" y="302" text-anchor="middle" class="l">A2: angle</text>
  <line x1="90" y1="190" x2="700" y2="130" class="e"/><circle cx="700" cy="130" r="7" fill="#b44d3a"/>
  <line x1="730" y1="190" x2="730" y2="130" class="m"/><text x="746" y="164" class="l">Delta y</text>
  <line x1="300" y1="325" x2="700" y2="325" class="d"/><text x="500" y="348" text-anchor="middle" class="l">L; angle approximately Delta y / L</text>
</svg>
