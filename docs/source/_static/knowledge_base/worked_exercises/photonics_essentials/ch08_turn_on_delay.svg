<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Laser turn-on delay design curves</title>
  <desc id="desc">Turn-on delay in picoseconds versus normalized drive current for three prebias levels.</desc>
  <rect width="720" height="440" fill="#fbfaf4"/>
  <g fill="none" stroke="#d8d5c8" stroke-width="1">
    <path d="M90 50V370H680"/>
    <path d="M90 50H680M90 161H680M90 272H680M90 370H680"/>
    <path d="M90 50V370M396 50V370M528 50V370M660 50V370"/>
  </g>
  <g fill="#292b2a" font-family="Georgia, serif" font-size="14">
    <text x="370" y="24" text-anchor="middle" font-size="19">Laser turn-on delay</text>
    <text x="385" y="425" text-anchor="middle">Drive current, J_2 / J_th (log scale)</text>
    <text x="18" y="215" text-anchor="middle" transform="rotate(-90 18 215)">Delay (ps, log scale)</text>
    <text x="108" y="392" text-anchor="middle">1.1</text>
    <text x="396" y="392" text-anchor="middle">5</text>
    <text x="528" y="392" text-anchor="middle">10</text>
    <text x="660" y="392" text-anchor="middle">20</text>
    <text x="82" y="55" text-anchor="end">300</text>
    <text x="82" y="166" text-anchor="end">30</text>
    <text x="82" y="277" text-anchor="end">3</text>
    <text x="82" y="375" text-anchor="end">0.4</text>
  </g>
  <polyline points="108.1,62.8 396.2,180.2 528.1,216.7 660,251.6" fill="none" stroke="#b13f2e" stroke-width="3"/>
  <polyline points="108.1,74.9 396.2,206.5 528.1,244.1 660,279.6" fill="none" stroke="#d48b23" stroke-width="3"/>
  <polyline points="108.1,120.8 396.2,282.0 528.1,320.9 660,356.9" fill="none" stroke="#315a84" stroke-width="3"/>
  <g fill="#292b2a" font-family="Georgia, serif" font-size="13">
    <rect x="475" y="65" width="185" height="63" rx="5" fill="#fbfaf4" stroke="#aaa"/>
    <path d="M487 81h24" stroke="#b13f2e" stroke-width="3"/><text x="518" y="86">J_1 = 0.1 J_th</text>
    <path d="M487 99h24" stroke="#d48b23" stroke-width="3"/><text x="518" y="104">J_1 = 0.5 J_th</text>
    <path d="M487 117h24" stroke="#315a84" stroke-width="3"/><text x="518" y="122">J_1 = 0.9 J_th</text>
  </g>
</svg>
