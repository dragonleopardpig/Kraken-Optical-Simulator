<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Junction capacitance per area versus carrier concentration</title>
  <desc id="desc">Four log-log curves for reverse biases zero, one, five, and ten volts.</desc>
  <rect width="720" height="440" fill="#fbfaf4"/>
  <g fill="none" stroke="#d8d5c8" stroke-width="1">
    <path d="M80 50V370H680"/>
    <path d="M80 50H680M80 157H680M80 263H680M80 370H680"/>
    <path d="M130 50V370M300 50V370M470 50V370M640 50V370"/>
  </g>
  <g fill="#292b2a" font-family="Georgia, serif" font-size="14">
    <text x="360" y="24" text-anchor="middle" font-size="19">Silicon junction capacitance</text>
    <text x="380" y="425" text-anchor="middle">Carrier concentration, N_D (cm^-3)</text>
    <text x="18" y="215" text-anchor="middle" transform="rotate(-90 18 215)">C/A (F cm^-2)</text>
    <text x="130" y="392" text-anchor="middle">10^15</text>
    <text x="300" y="392" text-anchor="middle">10^16</text>
    <text x="470" y="392" text-anchor="middle">10^17</text>
    <text x="640" y="392" text-anchor="middle">10^18</text>
    <text x="72" y="375" text-anchor="end">10^-9</text>
    <text x="72" y="268" text-anchor="end">10^-8</text>
    <text x="72" y="162" text-anchor="end">10^-7</text>
    <text x="72" y="55" text-anchor="end">10^-6</text>
  </g>
  <polyline points="130,262.3 300,209.0 470,155.6 640,102.3" fill="none" stroke="#b13f2e" stroke-width="3"/>
  <polyline points="130,281.1 300,227.7 470,174.4 640,121.1" fill="none" stroke="#d48b23" stroke-width="3"/>
  <polyline points="130,308.2 300,254.8 470,201.5 640,148.2" fill="none" stroke="#31746b" stroke-width="3"/>
  <polyline points="130,322.6 300,269.2 470,215.9 640,162.6" fill="none" stroke="#315a84" stroke-width="3"/>
  <g fill="#292b2a" font-family="Georgia, serif" font-size="13">
    <rect x="516" y="278" width="151" height="79" rx="5" fill="#fbfaf4" stroke="#aaa"/>
    <path d="M529 294h24" stroke="#b13f2e" stroke-width="3"/><text x="560" y="299">V_R = 0 V</text>
    <path d="M529 312h24" stroke="#d48b23" stroke-width="3"/><text x="560" y="317">V_R = 1 V</text>
    <path d="M529 330h24" stroke="#31746b" stroke-width="3"/><text x="560" y="335">V_R = 5 V</text>
    <path d="M529 348h24" stroke="#315a84" stroke-width="3"/><text x="560" y="353">V_R = 10 V</text>
  </g>
</svg>
