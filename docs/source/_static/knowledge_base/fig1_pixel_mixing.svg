<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Pixel grid with sub-pixel hot spot">
  <rect x="0" y="0" width="580" height="320" fill="#ffffff"/>

  <g stroke="#888" stroke-width="1.5" fill="#fafafa">
    <rect x="40"  y="40"  width="80" height="80"/>
    <rect x="120" y="40"  width="80" height="80"/>
    <rect x="200" y="40"  width="80" height="80"/>
    <rect x="40"  y="120" width="80" height="80"/>
    <rect x="120" y="120" width="80" height="80" fill="#fff4d6"/>
    <rect x="200" y="120" width="80" height="80"/>
    <rect x="40"  y="200" width="80" height="80"/>
    <rect x="120" y="200" width="80" height="80"/>
    <rect x="200" y="200" width="80" height="80"/>
  </g>
  <rect x="120" y="120" width="80" height="80" stroke="#b8860b" stroke-width="2" fill="none"/>

  <circle cx="160" cy="160" r="14" fill="#d63838" opacity="0.30"/>
  <rect   x="151" y="151" width="18" height="18" fill="#d63838"/>

  <line x1="200" y1="160" x2="335" y2="160" stroke="#b8860b" stroke-width="1"/>
  <text x="345" y="156" fill="#7a5c00" font-family="monospace" font-size="13">A_pixel = 1 mm²  (IFOV)</text>
  <text x="345" y="173" fill="#7a5c00" font-family="monospace" font-size="11" opacity="0.75">T_bg = 25 °C = 298 K</text>

  <line x1="169" y1="160" x2="335" y2="240" stroke="#d63838" stroke-width="1"/>
  <text x="345" y="237" fill="#a82020" font-family="monospace" font-size="13">A_spot = 0.01 mm²</text>
  <text x="345" y="254" fill="#a82020" font-family="monospace" font-size="11" opacity="0.85">T_hot = 200 °C = 473 K</text>

  <text x="345" y="290" fill="#222" font-family="monospace" font-size="13">f = A_spot / A_pixel = 1%</text>
</svg>
