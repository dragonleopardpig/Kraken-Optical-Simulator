<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="PSF spreading from sub-pixel point source to multi-pixel blob">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <radialGradient id="psfgrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d63838" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#d63838" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d63838" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>

  <rect x="40" y="40" width="120" height="120" fill="#fafafa" stroke="#888"/>
  <circle cx="100" cy="100" r="3" fill="#d63838"/>
  <text x="100" y="190" text-anchor="middle" fill="#555" font-size="11">point source</text>
  <text x="100" y="206" text-anchor="middle" fill="#555" font-size="11">(physically sub-pixel)</text>

  <line x1="175" y1="100" x2="240" y2="100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="207" y="85" text-anchor="middle" fill="#7a5c00" font-size="12">optics + PSF</text>

  <g transform="translate(260,40)" stroke="#888" stroke-width="1">
    <rect x="0"  y="0"  width="40" height="40" fill="#fafafa"/>
    <rect x="40" y="0"  width="40" height="40" fill="#f7e2d8"/>
    <rect x="80" y="0"  width="40" height="40" fill="#fafafa"/>
    <rect x="0"  y="40" width="40" height="40" fill="#f7e2d8"/>
    <rect x="40" y="40" width="40" height="40" fill="#e8a294"/>
    <rect x="80" y="40" width="40" height="40" fill="#f7e2d8"/>
    <rect x="0"  y="80" width="40" height="40" fill="#fafafa"/>
    <rect x="40" y="80" width="40" height="40" fill="#f7e2d8"/>
    <rect x="80" y="80" width="40" height="40" fill="#fafafa"/>
  </g>
  <circle cx="320" cy="100" r="55" fill="url(#psfgrad)"/>

  <text x="320" y="190" text-anchor="middle" fill="#555" font-size="11">sensor response</text>
  <text x="320" y="206" text-anchor="middle" fill="#555" font-size="11">(multi-pixel blob)</text>

  <text x="410" y="100" fill="#7a5c00" font-size="12">peak pixel ≫ NETD</text>
  <text x="410" y="118" fill="#555" font-size="11">neighbours ≈ skirt</text>
  <text x="410" y="136" fill="#555" font-size="11">no delta-shape →</text>
  <text x="410" y="152" fill="#555" font-size="11">not a hot pixel</text>
</svg>
