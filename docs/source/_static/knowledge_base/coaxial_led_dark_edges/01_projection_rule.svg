<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-labelledby="projection-title projection-desc">
  <title id="projection-title">Projection rule for a planar optical fold</title>
  <desc id="projection-desc">An ideal collimated beam has width W before and after reflection. Its footprint on a splitter tilted by theta is W divided by cosine theta. A physical clear length A on that splitter accepts A cosine theta.</desc>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title{fill:#111827;font-size:17px;font-weight:700}
      .subtitle{fill:#374151;font-size:12px}
      .label{fill:#111827;font-size:12px}
      .strong{fill:#111827;font-size:12px;font-weight:700}
      .small{fill:#4b5563;font-size:11px}
      .beam-in{stroke:#b45309;stroke-width:2;fill:none}
      .beam-out{stroke:#0f766e;stroke-width:2;fill:none}
      .splitter{stroke:#1d4ed8;stroke-width:4}
      .construct{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
      .dimension{stroke:#1d4ed8;stroke-width:1.4;fill:none}
      .normal-plane{stroke:#374151;stroke-width:3}
      .glass{fill:#0ea5e9;fill-opacity:.08;stroke:#0ea5e9;stroke-width:1.5}
      .formula{fill:#1d4ed8;font-size:14px;font-weight:700}
    </style>
  </defs>

  <text x="400" y="24" text-anchor="middle" class="title">A planar fold redirects a beam; it does not shrink its normal cross-section</text>
  <text x="400" y="44" text-anchor="middle" class="subtitle">cos θ converts between a dimension on the tilted surface and a dimension normal to the chief ray</text>

  <rect x="276" y="82" width="248" height="248" rx="8" class="glass"/>
  <line x1="300" y1="106" x2="500" y2="306" class="splitter"/>
  <text x="338" y="143" text-anchor="middle" transform="rotate(45 338 143)" class="strong">splitter plane</text>

  <line x1="65" y1="150" x2="344" y2="150" class="beam-in" marker-end="url(#arrow-amber)"/>
  <line x1="65" y1="260" x2="454" y2="260" class="beam-in"/>
  <line x1="65" y1="150" x2="65" y2="260" class="normal-plane"/>
  <line x1="46" y1="150" x2="46" y2="260" class="dimension"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="34" y="209" text-anchor="middle" transform="rotate(-90 34 209)" class="strong">W</text>
  <text x="120" y="136" class="strong" fill="#b45309">incoming collimated section</text>
  <text x="120" y="281" class="small">measured normal to the incident chief ray</text>

  <line x1="344" y1="150" x2="344" y2="382" class="beam-out" marker-end="url(#arrow-teal)"/>
  <line x1="454" y1="260" x2="454" y2="382" class="beam-out"/>
  <line x1="344" y1="382" x2="454" y2="382" class="normal-plane"/>
  <line x1="344" y1="400" x2="454" y2="400" class="dimension"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="399" y="416" text-anchor="middle" class="strong">W</text>
  <text x="490" y="350" class="strong" fill="#0f766e">reflected normal section</text>
  <text x="490" y="368" class="small">same width W</text>

  <line x1="344" y1="150" x2="454" y2="260" class="dimension"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="414" y="218" text-anchor="middle" transform="rotate(45 414 218)" class="strong">W / |cos θ|</text>
  <line x1="454" y1="260" x2="454" y2="312" class="construct"/>
  <path d="M475.2 281.2 A30 30 0 0 1 454 290" class="construct"/>
  <text x="478" y="303" class="label">θ</text>

  <line x1="550" y1="92" x2="734" y2="92" class="construct"/>
  <line x1="550" y1="92" x2="680" y2="222" class="splitter"/>
  <line x1="550" y1="242" x2="680" y2="242" class="dimension"
        marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="550" y1="92" x2="550" y2="242" class="construct"/>
  <line x1="680" y1="222" x2="680" y2="242" class="construct"/>
  <text x="618" y="145" transform="rotate(45 618 145)" class="strong">physical aperture A</text>
  <text x="615" y="263" text-anchor="middle" class="formula">projected clear width = A |cos θ|</text>
  <text x="642" y="294" text-anchor="middle" class="small">Use A only when it was measured</text>
  <text x="642" y="310" text-anchor="middle" class="small">along the tilted aperture plane.</text>
</svg>
