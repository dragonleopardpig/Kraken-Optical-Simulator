<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrBs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrKs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#111827"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .hyp  { stroke:#b45309; stroke-width:3.2; fill:none; }
      .proj { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .dim  { stroke:#1d4ed8; stroke-width:1.6; }
      .fov  { stroke:#111827; stroke-width:1.6; }
      .ra   { stroke:#374151; stroke-width:1.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Why 55 mm does not cover 39 mm — the 45° fold foreshortens the aperture</text>
  <text x="360" y="40" text-anchor="middle" class="sub">the 55 mm opening is the hypotenuse; its shadow on the fold axis is 55·cos 45° ≈ 38.9 mm ≈ the 39 mm FOV</text>

  <!-- triangle: A(200,300) left, B'(420,300) foot, B(420,80) top -->
  <!-- projection lines (orthographic drop from the hypotenuse to the fold axis) -->
  <line x1="255" y1="245" x2="255" y2="300" class="proj"/>
  <line x1="310" y1="190" x2="310" y2="300" class="proj"/>
  <line x1="365" y1="135" x2="365" y2="300" class="proj"/>
  <line x1="420" y1="80"  x2="420" y2="300" class="proj"/>

  <!-- hypotenuse = 55 mm clear aperture, edge-on, tilted 45 deg -->
  <line x1="200" y1="300" x2="420" y2="80" class="hyp"/>
  <text x="300" y="176" text-anchor="middle" transform="rotate(-45 300 176)" class="lblb" fill="#b45309">55 mm clear aperture — the hypotenuse (edge-on, 45°)</text>

  <!-- 45 deg arc at A -->
  <path d="M 246 300 A 46 46 0 0 0 232.5 267.5" class="ra"/>
  <text x="255" y="288" class="lbl">45°</text>

  <!-- right angle at B' -->
  <path d="M 420 288 L 408 288 L 408 300" class="ra"/>

  <!-- fold-axis shadow = horizontal projection (blue dimension) -->
  <line x1="200" y1="300" x2="420" y2="300" class="dim" marker-start="url(#arrBs)" marker-end="url(#arrB)"/>
  <text x="310" y="319" text-anchor="middle" class="lblb" fill="#1d4ed8">55·cos 45° ≈ 38.9 mm  (fold-axis shadow)</text>

  <!-- 39 mm FOV bracket, same width, just below -> zero margin -->
  <line x1="200" y1="340" x2="420" y2="340" class="fov" marker-start="url(#arrKs)" marker-end="url(#arrK)"/>
  <line x1="200" y1="335" x2="200" y2="345" class="fov"/>
  <line x1="420" y1="335" x2="420" y2="345" class="fov"/>
  <text x="310" y="358" text-anchor="middle" class="lbl">39 mm FOV — the shadow barely spans it (zero margin)</text>

  <!-- takeaway callout -->
  <text x="470" y="120" class="lblb">55 mm looks bigger than 39 mm,</text>
  <text x="470" y="138" class="lbl">but the fold tilts the opening 45°,</text>
  <text x="470" y="156" class="lbl">so only its shadow lands on the FOV:</text>
  <text x="470" y="182" class="lblb" fill="#b45309">55 · cos 45° = 38.9 mm</text>
  <text x="470" y="206" class="lbl">≈ 39 mm  ⇒  no margin ⇒ the</text>
  <text x="470" y="224" class="lbl">penumbra darkens the fold-axis edges.</text>
</svg>
