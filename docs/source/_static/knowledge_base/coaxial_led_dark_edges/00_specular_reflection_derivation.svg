<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-labelledby="reflection-title reflection-desc">
  <title id="reflection-title">Vector derivation of the specular-reflection direction</title>
  <desc id="reflection-desc">The left panel shows incident direction d pointing toward a planar splitter, reflected direction d r, unit normal n, and theta equal to the angle between minus d and n and to the angle between d r and n. The right panel translates the free vectors to a shared origin O; it is not a second ray path. It decomposes d into tangential component d parallel and normal component d perpendicular. Reflection leaves d parallel unchanged and reverses d perpendicular, giving d r equals d minus two times d dot n times n.</desc>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title{fill:#111827;font-size:19px;font-weight:700}
      .subtitle{fill:#374151;font-size:13px}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}
      .panel-title{fill:#111827;font-size:15px;font-weight:700}
      .label{fill:#111827;font-size:13px}
      .small{fill:#4b5563;font-size:12px}
      .formula{fill:#0f766e;font-size:17px;font-weight:700}
      .surface{stroke:#1d4ed8;stroke-width:5}
      .normal{stroke:#1d4ed8;stroke-width:2.2;fill:none}
      .incident{stroke:#b45309;stroke-width:3;fill:none}
      .reflected{stroke:#0f766e;stroke-width:3;fill:none}
      .tangent{stroke:#374151;stroke-width:2.5;fill:none}
      .normal-component{stroke:#7c3aed;stroke-width:2.5;fill:none}
      .construct{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:6 5;fill:none}
      .angle{stroke:#64748b;stroke-width:1.5;fill:none}
      .hit{fill:#111827}
      .amber{fill:#b45309}
      .teal{fill:#0f766e}
      .blue{fill:#1d4ed8}
      .violet{fill:#7c3aed}
    </style>
  </defs>

  <text x="500" y="27" text-anchor="middle" class="title">Specular reflection: keep the tangent component, reverse the normal component</text>
  <text x="500" y="49" text-anchor="middle" class="subtitle">d points in the direction of propagation toward the surface; n is a unit surface normal</text>

  <rect x="28" y="72" width="442" height="452" rx="9" class="panel"/>
  <rect x="490" y="72" width="482" height="452" rx="9" class="panel"/>

  <text x="249" y="99" text-anchor="middle" class="panel-title">1 — Ray geometry at the hit point P</text>

  <line x1="62" y1="300" x2="438" y2="300" class="surface"/>
  <text x="78" y="323" class="small">splitter tangent plane</text>
  <circle cx="250" cy="300" r="5" class="hit"/>
  <text x="259" y="320" class="label">P</text>

  <line x1="250" y1="300" x2="250" y2="127" class="normal" marker-end="url(#arrow-blue)"/>
  <text x="260" y="143" class="label blue">n</text>

  <line x1="84" y1="113" x2="250" y2="300" class="incident" marker-end="url(#arrow-amber)"/>
  <text x="130" y="153" class="label amber">incident direction d</text>
  <text x="108" y="173" class="small">arrow points toward P</text>

  <line x1="250" y1="300" x2="416" y2="113" class="reflected" marker-end="url(#arrow-teal)"/>
  <text x="333" y="151" class="label teal">reflected d<tspan dy="3" font-size="10">r</tspan></text>

  <path d="M224.1 270.8 A39 39 0 0 1 250 261" class="angle"/>
  <path d="M250 261 A39 39 0 0 1 275.9 270.8" class="angle"/>
  <text x="218" y="258" class="label">θ</text>
  <text x="276" y="258" class="label">θ</text>
  <text x="250" y="344" text-anchor="middle" class="label">θ = ∠(−d, n) = ∠(d<tspan dy="3" font-size="10">r</tspan><tspan dy="-3">, n)</tspan></text>
  <text x="250" y="370" text-anchor="middle" class="small">equal angles follow when the normal component</text>
  <text x="250" y="388" text-anchor="middle" class="small">changes sign and the tangent component does not</text>

  <rect x="79" y="416" width="340" height="70" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="249" y="441" text-anchor="middle" class="label">With n facing the incident half-space:</text>
  <text x="249" y="467" text-anchor="middle" class="panel-title amber">d · n &lt; 0</text>

  <text x="731" y="99" text-anchor="middle" class="panel-title">2 — Decompose, flip, and recombine</text>
  <text x="731" y="120" text-anchor="middle" class="small">translated free vectors share origin O — not a second ray path</text>

  <circle cx="570" cy="300" r="5" class="hit"/>
  <text x="550" y="323" class="label">O</text>
  <line x1="540" y1="300" x2="910" y2="300" class="construct"/>
  <line x1="570" y1="448" x2="570" y2="132" class="normal" marker-end="url(#arrow-blue)"/>
  <text x="581" y="148" class="label blue">n</text>

  <line x1="570" y1="300" x2="826" y2="300" class="tangent" marker-end="url(#arrow-blue)"/>
  <text x="689" y="286" text-anchor="middle" class="label">d<tspan dy="3" font-size="10">∥</tspan><tspan dy="-3"> = d − (d · n)n</tspan></text>

  <line x1="826" y1="300" x2="826" y2="437" class="normal-component" marker-end="url(#arrow-violet)"/>
  <text x="841" y="375" class="label violet">d<tspan dy="3" font-size="10">⊥</tspan><tspan dy="-3"> = (d · n)n</tspan></text>
  <line x1="570" y1="300" x2="826" y2="437" class="incident" marker-end="url(#arrow-amber)"/>
  <text x="682" y="390" class="label amber">d = d<tspan dy="3" font-size="10">∥</tspan><tspan dy="-3"> + d</tspan><tspan dy="3" font-size="10">⊥</tspan></text>

  <line x1="826" y1="300" x2="826" y2="163" class="normal-component" marker-end="url(#arrow-violet)"/>
  <text x="841" y="226" class="label violet">−d<tspan dy="3" font-size="10">⊥</tspan></text>
  <line x1="570" y1="300" x2="826" y2="163" class="reflected" marker-end="url(#arrow-teal)"/>
  <text x="678" y="206" class="label teal">d<tspan dy="3" font-size="10">r</tspan><tspan dy="-3"> = d</tspan><tspan dy="3" font-size="10">∥</tspan><tspan dy="-3"> − d</tspan><tspan dy="3" font-size="10">⊥</tspan></text>

  <line x1="826" y1="163" x2="826" y2="437" class="construct"/>
  <text x="731" y="471" text-anchor="middle" class="small">Substitute both projected components:</text>
  <text x="731" y="500" text-anchor="middle" class="formula">d<tspan dy="4" font-size="12">r</tspan><tspan dy="-4"> = d − 2(d · n)n</tspan></text>
</svg>
