<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4b5563"/>
      <stop offset="14%"  stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#fde047"/>
      <stop offset="86%"  stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrKs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dim  { stroke:#111827; stroke-width:1.5; }
      .warn { fill:#b91c1c; font-size:12px; font-weight:700; }
      .perp { stroke:#0f766e; stroke-width:1.6; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Only two edges darken — the fold axis is starved, the perpendicular axis is not</text>
  <text x="360" y="40" text-anchor="middle" class="sub">plan view of the 39 × 39 mm FOV;  brightness falls off only where the aperture just barely reaches</text>

  <!-- perpendicular-axis coverage: 78 mm, taller than the FOV (over-fills top and bottom) -->
  <line x1="232" y1="70" x2="232" y2="330" class="perp" marker-start="url(#arrKs)" marker-end="url(#arrK)" stroke="#0f766e"/>
  <text x="224" y="205" text-anchor="middle" transform="rotate(-90 224 205)" class="lblb" fill="#0f766e">perpendicular aperture 78 mm — over-fills the FOV</text>
  <line x1="226" y1="110" x2="238" y2="110" class="perp"/>
  <line x1="226" y1="310" x2="238" y2="310" class="perp"/>

  <!-- FOV square, horizontal gradient: bright centre, dark left & right (fold-axis) edges -->
  <rect x="260" y="110" width="200" height="200" fill="url(#foldGrad)" stroke="#111827" stroke-width="1.5"/>

  <!-- fold aperture bracket on top: 39 mm, same width as the FOV (zero margin) -->
  <line x1="260" y1="92" x2="460" y2="92" class="dim" marker-start="url(#arrKs)" marker-end="url(#arrK)"/>
  <text x="360" y="86" text-anchor="middle" class="lblb">fold aperture ≈ 39 mm = FOV width (zero margin)</text>

  <!-- dark-edge callouts -->
  <text x="360" y="360" text-anchor="middle" class="lbl">fold axis →  (55 mm opening, tilted 45°)</text>
  <text x="285" y="215" text-anchor="middle" class="warn" transform="rotate(-90 285 215)">dark edge</text>
  <text x="435" y="215" text-anchor="middle" class="warn" transform="rotate(-90 435 215)">dark edge</text>
  <line x1="196" y1="210" x2="258" y2="210" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="524" y1="210" x2="462" y2="210" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="150" y="214" text-anchor="middle" class="warn">penumbra</text>
  <text x="570" y="214" text-anchor="middle" class="warn">penumbra</text>
</svg>
