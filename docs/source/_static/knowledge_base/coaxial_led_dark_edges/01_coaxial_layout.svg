<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrAmb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .glass { fill:#0ea5e9; fill-opacity:0.10; stroke:#0ea5e9; stroke-width:2; }
      .coat  { stroke:#1d4ed8; stroke-width:2.4; }
      .led   { fill:#fde047; stroke:#ca8a04; stroke-width:1.5; }
      .sensor{ fill:#475569; fill-opacity:0.20; stroke:#475569; stroke-width:2; }
      .obj   { fill:#0f766e; fill-opacity:0.14; stroke:#0f766e; stroke-width:2; }
      .illum { stroke:#b45309; stroke-width:1.8; fill:none; }
      .image { stroke:#0f766e; stroke-width:1.6; stroke-dasharray:6,4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Coaxial-LED illuminator — light folds 45° down onto the object</text>
  <text x="360" y="40" text-anchor="middle" class="sub">flat area LED → 45° beam splitter → object/FOV;  the camera looks straight down the same axis</text>

  <!-- Beam splitter cube: centre (360,200), 90 px square, coating top-left to bottom-right -->
  <rect x="315" y="155" width="90" height="90" class="glass"/>
  <line x1="315" y1="155" x2="405" y2="245" class="coat"/>
  <text x="360" y="150" text-anchor="middle" class="lbl">45° beam splitter (55 mm cube)</text>

  <!-- LED area emitter on the left -->
  <rect x="112" y="165" width="14" height="70" class="led"/>
  <text x="118" y="256" text-anchor="middle" class="lbl">flat area LED</text>
  <text x="118" y="271" text-anchor="middle" class="sub">55 mm on the fold axis</text>

  <!-- Illumination rays: horizontal from the LED, folding DOWN at the coating to the object -->
  <path d="M126 175 L335 175 L335 318" class="illum" marker-end="url(#arrAmb)"/>
  <path d="M126 200 L360 200 L360 318" class="illum" marker-end="url(#arrAmb)"/>
  <path d="M126 225 L385 225 L385 318" class="illum" marker-end="url(#arrAmb)"/>

  <!-- Object / FOV at the bottom -->
  <rect x="315" y="320" width="90" height="12" class="obj"/>
  <text x="360" y="352" text-anchor="middle" class="lbl">object / FOV — 39 × 39 mm</text>

  <!-- Sensor at the top -->
  <rect x="330" y="66" width="60" height="12" class="sensor"/>
  <text x="360" y="60" text-anchor="middle" class="lbl">sensor / camera</text>

  <!-- Imaging path: object → up through the BS → sensor (shared axis) -->
  <path d="M366 316 L366 80" class="image" marker-end="url(#arrTeal)"/>

  <text x="470" y="196" class="sub">the illumination and the</text>
  <text x="470" y="211" class="sub">imaging path share one axis</text>
  <text x="470" y="226" class="sub">below the beam splitter</text>
</svg>
