<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460"
     font-family="Arial, Helvetica, sans-serif" role="img"
     aria-labelledby="lambertian-title lambertian-desc">
  <title id="lambertian-title">Lambertian emitter propagation through a finite aperture</title>
  <desc id="lambertian-desc">In an unfolded reflection view, points across a finite Lambertian emitter send many ray angles through an aperture to a geometry-dependent object-plane irradiance distribution with penumbra. The emitter outline is not a fixed beam cross-section.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <linearGradient id="irradiance" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="17%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="83%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <style>
      .title{fill:#111827;font-size:17px;font-weight:700}
      .subtitle{fill:#374151;font-size:12px}
      .label{fill:#111827;font-size:12px}
      .strong{fill:#111827;font-size:12px;font-weight:700}
      .small{fill:#4b5563;font-size:11px}
      .source{fill:#fde047;stroke:#ca8a04;stroke-width:2}
      .wall{fill:#94a3b8;stroke:#475569;stroke-width:1.5}
      .object{fill:url(#irradiance);stroke:#0f766e;stroke-width:2}
      .ray{stroke:#b45309;stroke-width:1.4;fill:none;opacity:.8}
      .chief{stroke:#0f766e;stroke-width:2;fill:none;stroke-dasharray:7 4}
      .plane{stroke:#9ca3af;stroke-width:1;stroke-dasharray:5 4}
      .penumbra{fill:#b91c1c;font-size:11px;font-weight:700}
      .callout{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.2}
    </style>
  </defs>

  <text x="400" y="24" text-anchor="middle" class="title">A Lambertian emitter is not a same-size collimated beam</text>
  <text x="400" y="44" text-anchor="middle" class="subtitle">unfolded reflection view: source position + angular distribution + aperture visibility determine Object-plane irradiance</text>

  <line x1="90" y1="78" x2="90" y2="340" class="plane"/>
  <line x1="390" y1="78" x2="390" y2="340" class="plane"/>
  <line x1="710" y1="78" x2="710" y2="340" class="plane"/>

  <rect x="80" y="145" width="20" height="130" class="source"/>
  <circle cx="100" cy="158" r="3" fill="#b45309"/>
  <circle cx="100" cy="210" r="3" fill="#b45309"/>
  <circle cx="100" cy="262" r="3" fill="#b45309"/>
  <text x="90" y="425" text-anchor="middle" class="strong">55 × 74 mm emitter</text>
  <text x="90" y="443" text-anchor="middle" class="small">many directions per point</text>

  <rect x="380" y="80" width="20" height="92" class="wall"/>
  <rect x="380" y="248" width="20" height="92" class="wall"/>
  <text x="390" y="425" text-anchor="middle" class="strong">finite clear aperture</text>
  <text x="390" y="443" text-anchor="middle" class="small">clips position and angle</text>

  <rect x="700" y="105" width="20" height="210" class="object"/>
  <text x="710" y="425" text-anchor="middle" class="strong">Object-plane irradiance E(x,y)</text>
  <text x="710" y="443" text-anchor="middle" class="small">geometry-dependent profile</text>

  <path d="M100 158 L390 178 L710 116" class="ray" marker-end="url(#arrow)"/>
  <path d="M100 158 L390 198 L710 188" class="ray" marker-end="url(#arrow)"/>
  <path d="M100 210 L390 188 L710 142" class="ray" marker-end="url(#arrow)"/>
  <path d="M100 210 L390 210 L710 210" class="chief"/>
  <path d="M100 210 L390 232 L710 278" class="ray" marker-end="url(#arrow)"/>
  <path d="M100 262 L390 222 L710 232" class="ray" marker-end="url(#arrow)"/>
  <path d="M100 262 L390 242 L710 304" class="ray" marker-end="url(#arrow)"/>

  <path d="M100 145 L380 110" class="ray"/>
  <circle cx="380" cy="110" r="3" fill="#b91c1c"/>
  <path d="M100 275 L380 310" class="ray"/>
  <circle cx="380" cy="310" r="3" fill="#b91c1c"/>
  <text x="318" y="98" class="penumbra">blocked angular rays</text>

  <rect x="190" y="350" width="320" height="55" rx="7" class="callout"/>
  <text x="350" y="371" text-anchor="middle" class="strong">A plane fold can be “unfolded” into this straight path.</text>
  <text x="350" y="390" text-anchor="middle" class="small">It redirects radiance but does not form a 1:1 real image of the LED.</text>
</svg>
