<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Penta prism face labels versus world-axis fit references</title>
  <desc id="desc">A YZ projection of a penta prism showing +Z to the right, +Y upward, input face Left, output face Down, mirror faces on the slanted sides, and front/back faces along X out of the screen.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ea043"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .axis { stroke: #1f6feb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .ray { stroke: #39d353; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .ray-thin { stroke: #39d353; stroke-width: 2.4; fill: none; opacity: 0.65; }
      .solid { fill: #f6f8fa; stroke: #8c99aa; stroke-width: 5; stroke-linejoin: round; }
      .face { stroke: #24292f; stroke-width: 4; stroke-linecap: round; }
      .mirror { stroke: #d1242f; stroke-width: 5; stroke-linecap: round; }
      .port { stroke: #0969da; stroke-width: 5; stroke-linecap: round; }
      .note-box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #24292f; font-size: 18px; }
      .small { font-size: 15px; fill: #57606a; }
      .tiny { font-size: 13px; fill: #57606a; }
      .blue { fill: #0969da; }
      .green { fill: #1a7f37; }
      .red { fill: #cf222e; }
      .gray { fill: #57606a; }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="44" y="42" class="label">World axes in the YZ plot</text>
  <line x1="72" y1="112" x2="178" y2="112" class="axis"/>
  <line x1="72" y1="112" x2="72" y2="34" class="axis"/>
  <text x="186" y="118" class="label blue">+Z right</text>
  <text x="44" y="28" class="label blue">+Y up</text>
  <text x="28" y="138" class="small">+X / -X are front/back, out of this slice</text>

  <polygon class="solid" points="390,168 616,74 764,180 666,334 390,334"/>

  <line x1="390" y1="168" x2="390" y2="334" class="port"/>
  <line x1="390" y1="334" x2="666" y2="334" class="port"/>
  <line x1="616" y1="74" x2="764" y2="180" class="face"/>
  <line x1="390" y1="168" x2="616" y2="74" class="mirror"/>
  <line x1="764" y1="180" x2="666" y2="334" class="mirror"/>

  <text x="318" y="246" class="label blue">F005</text>
  <text x="291" y="270" class="small">side_2d = Left</text>
  <text x="284" y="292" class="small">Input Port</text>
  <text x="420" y="359" class="label blue">F006 side_2d = Down, Output Port</text>
  <text x="503" y="100" class="label red">F003 Mirror</text>
  <text x="698" y="260" class="label red">F004 Mirror</text>
  <text x="624" y="122" class="small gray">ordinary side face</text>
  <text x="682" y="149" class="tiny gray">often Auto/Unassigned</text>

  <path d="M 170 250 L 390 250 L 536 122 L 706 252 L 524 334 L 524 468" class="ray"/>
  <path d="M 170 228 L 390 228 L 528 116 L 696 238 L 502 334 L 502 468" class="ray-thin"/>
  <path d="M 170 272 L 390 272 L 544 128 L 716 266 L 546 334 L 546 468" class="ray-thin"/>
  <text x="192" y="223" class="label green">incoming +Z bundle</text>
  <text x="548" y="485" class="label green">outgoing -Y bundle</text>

  <line x1="390" y1="250" x2="322" y2="250" stroke="#6e7781" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="254" y="235" class="small">fit face normal to -Z</text>
  <line x1="524" y1="334" x2="524" y2="402" stroke="#6e7781" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="544" y="391" class="small">output normal -Y</text>

  <line x1="606" y1="290" x2="708" y2="392" class="axis dash" marker-end="url(#arrow-blue)"/>
  <text x="718" y="408" class="small blue">This is a ray/output direction,</text>
  <text x="718" y="429" class="small blue">not the label for a mirror face.</text>

  <rect x="52" y="400" width="386" height="118" class="note-box"/>
  <text x="70" y="429" class="label">Two independent fields</text>
  <text x="70" y="457" class="small">2D side: Left / Right / Up / Down / Front / Back</text>
  <text x="70" y="480" class="small">Fit reference: +Y / -Y / +Z / -Z / +X / -X normal</text>
  <text x="70" y="503" class="small">Function: Mirror, Transmit/Port, Absorber, Unassigned</text>

  <rect x="594" y="20" width="330" height="86" class="note-box"/>
  <text x="612" y="49" class="label">Rule of thumb</text>
  <text x="612" y="74" class="small">Label ports by where the row attaches.</text>
  <text x="612" y="96" class="small">Label slanted reflective faces as Mirror, not Down.</text>
</svg>
