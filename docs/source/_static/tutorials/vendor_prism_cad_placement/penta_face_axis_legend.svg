<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Penta prism face labels versus world-axis fit references</title>
  <desc id="desc">A YZ projection of the 42779 penta prism orientation used by the case study: incoming rays travel along +Z from the left, the first prism sends them downward in -Y toward the next prism, and the port labels stay separate from world-axis normal fit references.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ea043"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .axis { stroke: #1f6feb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .axis-muted { stroke: #6e7781; stroke-width: 2.4; marker-end: url(#arrow-gray); }
      .ray { stroke: #39d353; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .ray-thin { stroke: #39d353; stroke-width: 2.4; fill: none; opacity: 0.65; }
      .solid { fill: #f6f8fa; stroke: #8c99aa; stroke-width: 5; stroke-linejoin: round; }
      .face { stroke: #24292f; stroke-width: 4; stroke-linecap: round; }
      .mirror { stroke: #d1242f; stroke-width: 5; stroke-linecap: round; }
      .port { stroke: #0969da; stroke-width: 5; stroke-linecap: round; }
      .note-box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #24292f; font-size: 18px; }
      .small { font-size: 15px; fill: #57606a; }
      .tiny { font-size: 13px; fill: #57606a; }
      .blue { fill: #0969da; }
      .green { fill: #1a7f37; }
      .red { fill: #cf222e; }
      .gray { fill: #57606a; }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="44" y="42" class="label">World axes in the YZ plot</text>
  <line x1="72" y1="112" x2="178" y2="112" class="axis"/>
  <line x1="72" y1="112" x2="72" y2="34" class="axis"/>
  <line x1="72" y1="112" x2="72" y2="184" class="axis-muted"/>
  <text x="186" y="118" class="label blue">+Z right</text>
  <text x="44" y="28" class="label blue">+Y up</text>
  <text x="86" y="184" class="small gray">-Y down in this screen view</text>
  <text x="28" y="214" class="small">+X / -X are front/back, out of this slice</text>

  <polygon class="solid" points="410,214 540,160 690,232 632,332 410,332"/>

  <line x1="410" y1="214" x2="410" y2="332" class="port"/>
  <line x1="410" y1="332" x2="632" y2="332" class="port"/>
  <line x1="540" y1="160" x2="690" y2="232" class="face"/>
  <line x1="410" y1="214" x2="540" y2="160" class="mirror"/>
  <line x1="690" y1="232" x2="632" y2="332" class="mirror"/>

  <text x="330" y="262" class="label blue">F005</text>
  <text x="302" y="286" class="small">side_2d = Left</text>
  <text x="296" y="308" class="small">Input Port</text>
  <text x="422" y="360" class="label blue">F006 side_2d = Down, Output Port</text>
  <text x="472" y="154" class="label red">F003 Mirror</text>
  <text x="648" y="292" class="label red">F004 Mirror</text>
  <text x="594" y="184" class="small gray">ordinary side face</text>
  <text x="662" y="211" class="tiny gray">often Auto/Unassigned</text>

  <path d="M 170 274 L 410 274 L 510 178 L 670 260 L 558 332 L 558 468" class="ray"/>
  <path d="M 170 252 L 410 252 L 502 172 L 660 246 L 534 332 L 534 468" class="ray-thin"/>
  <path d="M 170 296 L 410 296 L 518 184 L 680 274 L 582 332 L 582 468" class="ray-thin"/>
  <text x="192" y="245" class="label green">incoming +Z bundle</text>
  <text x="590" y="485" class="label green">outgoing -Y bundle</text>

  <line x1="410" y1="274" x2="342" y2="274" stroke="#6e7781" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="266" y="259" class="small">fit face normal to -Z</text>
  <line x1="558" y1="332" x2="558" y2="404" stroke="#6e7781" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="578" y="396" class="small">fit output normal to -Y</text>

  <line x1="632" y1="312" x2="726" y2="390" class="axis dash" marker-end="url(#arrow-blue)"/>
  <text x="736" y="408" class="small blue">This is a reflected ray direction,</text>
  <text x="736" y="429" class="small blue">not a reason to label the mirror Down.</text>

  <rect x="52" y="400" width="386" height="118" class="note-box"/>
  <text x="70" y="429" class="label">Two independent fields</text>
  <text x="70" y="457" class="small">2D side: Left / Right / Up / Down / Front / Back</text>
  <text x="70" y="480" class="small">Fit reference: +Y / -Y / +Z / -Z / +X / -X normal</text>
  <text x="70" y="503" class="small">Function: Mirror, Transmit/Port, Absorber, Unassigned</text>

  <rect x="594" y="20" width="350" height="86" class="note-box"/>
  <text x="612" y="49" class="label">Rule of thumb</text>
  <text x="612" y="74" class="small">This case-study prism sends +Z input to -Y output.</text>
  <text x="612" y="96" class="small">Label slanted reflective faces as Mirror, not Down.</text>
</svg>
