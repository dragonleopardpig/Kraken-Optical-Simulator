  <text x="310.0" y="274" text-anchor="middle" class="lbl">waist_offset_mm  =  z_R · √((D/(2 w₀))² − 1)</text>
  <text x="50" y="305" class="sub">θ = Θ_full / 2     w₀ = M² λ / (π n θ)     zR = π n w₀² / (M² λ)</text>
  <text x="50" y="324" class="sub">Pick "Waist before source" for a diverging laser output, "Waist after source" for a converging beam.</text>
  <text x="50" y="342" class="sub">If D/2 &lt; w₀ the requested (D, Θ_full) pair is unphysical and the UI flags an invalid input.</text>
