<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ttl   { fill:#111827; font-size:14px; font-weight:700; }
      .sub   { fill:#374151; font-size:10.5px; }
      .axis  { stroke:#9ca3af; stroke-width:1; }
      .grid  { stroke:#cbd5e1; stroke-width:0.8; stroke-dasharray:2,2; }
      .pt    { fill:#b91c1c; stroke:none; }
      .pup   { fill:#eff6ff; stroke:#1e3a8a; stroke-width:1.4; }
      .lblx  { fill:#374151; font-size:10px; }
      .nm    { stroke:#1e3a8a; stroke-width:1.8; fill:none; }
      .nm2   { stroke:#15803d; stroke-width:1.8; fill:none; }
      .nm3   { stroke:#b45309; stroke-width:1.8; fill:none; }
      .arr   { stroke:#374151; stroke-width:1; fill:none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <text x="180" y="20" text-anchor="middle" class="ttl">Pupil Diagnostic</text>
  <text x="180" y="36" text-anchor="middle" class="sub">Entrance / exit-pupil location and size</text>
  <line x1="20" y1="160" x2="340" y2="160" class="axis"/>
  <line x1="40" y1="130.0" x2="40" y2="190.0" stroke="#374151" stroke-width="2"/>
  <text x="40" y="204.0" text-anchor="middle" class="lblx">object</text>
  <line x1="110" y1="125.0" x2="110" y2="195.0" stroke="#1e3a8a" stroke-width="2"/>
  <text x="110" y="209.0" text-anchor="middle" class="lblx">EP</text>
  <line x1="180" y1="120.0" x2="180" y2="200.0" stroke="#111827" stroke-width="2"/>
  <text x="180" y="214.0" text-anchor="middle" class="lblx">Stop</text>
  <line x1="250" y1="130.0" x2="250" y2="190.0" stroke="#1e3a8a" stroke-width="2"/>
  <text x="250" y="204.0" text-anchor="middle" class="lblx">XP</text>
  <line x1="320" y1="135.0" x2="320" y2="185.0" stroke="#374151" stroke-width="2"/>
  <text x="320" y="199.0" text-anchor="middle" class="lblx">image</text>
  <polyline points="40,180 110,135 180,120 250,135 320,180" stroke="#b91c1c" stroke-width="1.6" fill="none"/>
  <polyline points="40,140 110,185 180,200 250,185 320,140" stroke="#b91c1c" stroke-width="1.6" fill="none"/>
  <polyline points="40,170 110,160 180,160 250,160 320,150" stroke="#15803d" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>
  <text x="20" y="240" class="sub">m_enter = θ₀ / θ_stop,    EPD = D_stop / m_enter</text>
  <text x="20" y="256" class="sub">m_exit = θ₀ / θ_image,    XPD = D_stop · m_exit</text>
</svg>
