<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ttl   { fill:#111827; font-size:14px; font-weight:700; }
      .sub   { fill:#374151; font-size:10.5px; }
      .axis  { stroke:#9ca3af; stroke-width:1; }
      .grid  { stroke:#cbd5e1; stroke-width:0.8; stroke-dasharray:2,2; }
      .pt    { fill:#b91c1c; stroke:none; }
      .pup   { fill:#eff6ff; stroke:#1e3a8a; stroke-width:1.4; }
      .lblx  { fill:#374151; font-size:10px; }
      .nm    { stroke:#1e3a8a; stroke-width:1.8; fill:none; }
      .nm2   { stroke:#15803d; stroke-width:1.8; fill:none; }
      .nm3   { stroke:#b45309; stroke-width:1.8; fill:none; }
      .arr   { stroke:#374151; stroke-width:1; fill:none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <text x="180" y="20" text-anchor="middle" class="ttl">Point Spread Function</text>
  <text x="180" y="36" text-anchor="middle" class="sub">|FT{P(u,v)·eⁱᵏW(u,v)}|²</text>
  <defs>
    <radialGradient id="airy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="18%" stop-color="#f59e0b"/>
      <stop offset="38%" stop-color="#7c2d12" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#fef3c7" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7c2d12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <rect x="90" y="75" width="180" height="180" fill="#0f172a"/>
  <circle cx="180" cy="165" r="80" fill="url(#airy)"/>
  <line x1="180" y1="165" x2="215" y2="147" stroke="#fef3c7" stroke-width="1"/>
  <text x="218" y="145" fill="#fef3c7" font-size="10.5">r_Airy = 1.22 λ F/#</text>
  <text x="20" y="115" class="sub">PSF(x,y) =</text>
  <text x="20" y="133" class="sub">| ∬ P(u,v)·</text>
  <text x="20" y="151" class="sub">  exp[i k W(u,v)] ·</text>
  <text x="20" y="169" class="sub">  exp[-i 2π(ux+vy)/(λz)]</text>
  <text x="20" y="187" class="sub">  du dv |²</text>
</svg>
