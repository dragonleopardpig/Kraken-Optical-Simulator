<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .fp   { stroke:#111827; stroke-width:1.4; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 4 — Nodal points</text>
  <text x="360" y="40" text-anchor="middle" class="sub">A ray aimed at the front nodal point N emerges from N' parallel to itself (same slope).</text>
  <line x1="20" y1="200" x2="700" y2="200" class="axis"/>
  <text x="702" y="196" class="sub">optical axis</text>
  <rect x="230" y="100" width="240" height="200" rx="6" ry="6" class="sys"/>
  <text x="350.0" y="94" text-anchor="middle" class="sub" font-style="italic">optical system</text>
  <line x1="290" y1="110" x2="290" y2="290" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="290" y="102" text-anchor="middle" class="pp-l" fill="#0f766e">P = N</text>
  <line x1="410" y1="110" x2="410" y2="290" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="410" y="102" text-anchor="middle" class="pp-l" fill="#0f766e">P' = N'</text>
  <line x1="40.0" y1="287.5" x2="290.0" y2="200.0" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="60" cy="279.5" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="60" y="283.5" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <text x="78" y="283.5" class="sub">aim a ray at N (front nodal point)</text>
  <line x1="410.0" y1="200.0" x2="690.0" y2="102.0" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="580" cy="88.0" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="580" y="92.0" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <text x="598" y="92.0" class="sub">emerges from N' with the same slope</text>
  <line x1="290.0" y1="200.0" x2="410.0" y2="200.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="350.0" cy="230" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="350.0" y="234" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <text x="368.0" y="234" class="sub">the ray is translated, not deviated → angular magnification = 1</text>
  <circle cx="290" cy="200" r="4" fill="#15803d" stroke="white" stroke-width="1.5"/>
  <text x="290" y="230" text-anchor="middle" class="lblb" fill="#15803d">N</text>
  <circle cx="410" cy="200" r="4" fill="#15803d" stroke="white" stroke-width="1.5"/>
  <text x="410" y="230" text-anchor="middle" class="lblb" fill="#15803d">N'</text>
  <rect x="20" y="290" width="260" height="52" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="30" y1="301" x2="56" y2="301" stroke="#15803d" stroke-width="2"/>
  <text x="62" y="304" class="sub">Step 1: incident ray aimed at N</text>
  <line x1="30" y1="315" x2="56" y2="315" stroke="#15803d" stroke-width="2"/>
  <text x="62" y="318" class="sub">Step 2: emergent parallel ray from N'</text>
  <line x1="30" y1="329" x2="56" y2="329" stroke="#0f766e" stroke-width="2"/>
  <text x="62" y="332" class="sub">In air, N=P and N'=P'</text>
</svg>
