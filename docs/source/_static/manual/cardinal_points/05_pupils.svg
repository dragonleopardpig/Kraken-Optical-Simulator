<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 5 — Entrance pupil (EP) and exit pupil (XP)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">EP and XP are images of the aperture stop formed by the front and back optics.</text>
  <line x1="20" y1="180" x2="700" y2="180" class="axis"/>
  <text x="698" y="176" text-anchor="end" class="sub">optical axis</text>
  <ellipse cx="250" cy="180" rx="10" ry="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250" y="108" text-anchor="middle" class="lblb" fill="#1d4ed8">L₁</text>
  <ellipse cx="480" cy="180" rx="10" ry="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="480" y="108" text-anchor="middle" class="lblb" fill="#1d4ed8">L₂</text>
  <line x1="350" y1="138" x2="350" y2="168" class="stop"/>
  <line x1="350" y1="192" x2="350" y2="222" class="stop"/>
  <text x="350" y="238" text-anchor="middle" class="lblb">aperture stop</text>
  <circle cx="350" cy="122" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="350" y="126" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <line x1="160.0" y1="180.0" x2="250.0" y2="130.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="250.0" y1="130.0" x2="350.0" y2="138.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="160.0" y1="180.0" x2="250.0" y2="230.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="250.0" y1="230.0" x2="350.0" y2="222.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="590.0" y1="180.0" x2="480.0" y2="130.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="480.0" y1="130.0" x2="350.0" y2="138.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="590.0" y1="180.0" x2="480.0" y2="230.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="480.0" y1="230.0" x2="350.0" y2="222.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="160" y1="152" x2="160" y2="208" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="160" y="146" text-anchor="middle" class="lblb" fill="#7c3aed">EP</text>
  <line x1="590" y1="152" x2="590" y2="208" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="590" y="146" text-anchor="middle" class="lblb" fill="#7c3aed">XP</text>
  <circle cx="160" cy="236" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="160" y="240" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <circle cx="590" cy="236" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="590" y="240" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <text x="20" y="322" class="lblb">Construction steps</text>
  <circle cx="28" cy="336" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="339.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">1</text>
  <text x="44" y="340" class="sub">Locate the surface that physically limits the on-axis bundle — the aperture stop.</text>
  <circle cx="28" cy="354" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="357.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">2</text>
  <text x="44" y="358" class="sub">Image the stop backward through every optic in front of it → the result is the entrance pupil EP.</text>
  <circle cx="28" cy="372" r="9" fill="#fef3c7" stroke="#92400e" stroke-width="1.2"/>
  <text x="28" y="375.5" text-anchor="middle" class="lblb" fill="#92400e" font-size="10.5px">3</text>
  <text x="44" y="376" class="sub">Image the stop forward through every optic behind it → the result is the exit pupil XP.</text>
  <text x="20" y="398" class="lblb">Legend</text>
  <line x1="22" y1="412" x2="50" y2="412" stroke="#111827" stroke-width="2.4"/>
  <text x="56" y="416" class="sub">Aperture stop</text>
  <line x1="22" y1="428" x2="50" y2="428" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="56" y="432" class="sub">Stop-imaging conjugate rays (dashed purple)</text>
  <line x1="22" y1="444" x2="50" y2="444" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="56" y="448" class="sub">EP and XP markers</text>
</svg>
