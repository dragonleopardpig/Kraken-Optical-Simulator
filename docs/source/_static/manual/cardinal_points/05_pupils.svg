<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .fp   { stroke:#111827; stroke-width:1.4; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 5 — Entrance pupil (EP) and exit pupil (XP)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">EP and XP are the images of the aperture stop formed by the optics in front of and behind it.</text>
  <line x1="20" y1="200" x2="700" y2="200" class="axis"/>
  <text x="702" y="196" class="sub">optical axis</text>
  <ellipse cx="250" cy="200" rx="10" ry="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250" y="122" text-anchor="middle" class="lblb" fill="#1d4ed8">L₁</text>
  <ellipse cx="480" cy="200" rx="10" ry="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="480" y="122" text-anchor="middle" class="lblb" fill="#1d4ed8">L₂</text>
  <line x1="350" y1="154" x2="350" y2="186" class="stop"/>
  <line x1="350" y1="214" x2="350" y2="246" class="stop"/>
  <text x="350" y="262" text-anchor="middle" class="lblb">aperture stop</text>
  <circle cx="350" cy="140" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="350" y="144" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <text x="368" y="144" class="sub">identify the surface that limits the bundle = aperture stop</text>
  <line x1="160.0" y1="200.0" x2="250.0" y2="150.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="250.0" y1="150.0" x2="350.0" y2="154.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="160.0" y1="200.0" x2="250.0" y2="250.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="250.0" y1="250.0" x2="350.0" y2="246.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="590.0" y1="200.0" x2="480.0" y2="158.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="480.0" y1="158.0" x2="350.0" y2="154.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="590.0" y1="200.0" x2="480.0" y2="242.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="480.0" y1="242.0" x2="350.0" y2="246.0" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="160" y1="172" x2="160" y2="228" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="160" y="164" text-anchor="middle" class="lblb" fill="#7c3aed">EP</text>
  <line x1="590" y1="172" x2="590" y2="228" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="590" y="164" text-anchor="middle" class="lblb" fill="#7c3aed">XP</text>
  <circle cx="160" cy="262" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="160" y="266" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <text x="178" y="266" class="sub">image the stop backward through L₁ → EP</text>
  <circle cx="590" cy="262" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="590" y="266" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <text x="608" y="266" class="sub">image the stop forward through L₂ → XP</text>
  <rect x="20" y="310" width="260" height="38" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="30" y1="321" x2="56" y2="321" stroke="#111827" stroke-width="2"/>
  <text x="62" y="324" class="sub">Step 1: locate the aperture stop</text>
  <line x1="30" y1="335" x2="56" y2="335" stroke="#7c3aed" stroke-width="2"/>
  <text x="62" y="338" class="sub">Step 2/3: image the stop through the front / back optics</text>
</svg>
