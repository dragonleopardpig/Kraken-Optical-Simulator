<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .ttl  { fill:#111827; font-size:16px; font-weight:700; }
      .sub  { fill:#374151; font-size:11.5px; }
      .axis { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .lbl  { fill:#111827; font-size:12px; }
      .lblb { fill:#111827; font-size:12px; font-weight:700; }
      .dash { stroke:#6b7280; stroke-width:1; stroke-dasharray:4,4; fill:none; }
      .sys  { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.4; opacity:0.45; }
      .pp   { stroke:#0f766e; stroke-width:1.4; stroke-dasharray:3,3; }
      .pp-l { fill:#0f766e; font-size:12px; font-weight:700; }
      .fp   { stroke:#111827; stroke-width:1.4; }
      .stop { stroke:#111827; stroke-width:3; }
      .ray-r { stroke:#b91c1c; stroke-width:2; fill:none; }
      .ray-b { stroke:#1d4ed8; stroke-width:2; fill:none; }
      .ray-g { stroke:#15803d; stroke-width:2; fill:none; }
      .ray-o { stroke:#b45309; stroke-width:2; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 6 — Chief and marginal rays</text>
  <text x="360" y="40" text-anchor="middle" class="sub">The chief ray passes through the centre of the stop, EP, and XP; the marginal ray grazes their edges.</text>
  <line x1="20" y1="200" x2="700" y2="200" class="axis"/>
  <text x="702" y="196" class="sub">optical axis</text>
  <ellipse cx="250" cy="200" rx="10" ry="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250" y="122" text-anchor="middle" class="lblb" fill="#1d4ed8">L₁</text>
  <ellipse cx="480" cy="200" rx="10" ry="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="480" y="122" text-anchor="middle" class="lblb" fill="#1d4ed8">L₂</text>
  <line x1="350" y1="154" x2="350" y2="186" class="stop"/>
  <line x1="350" y1="214" x2="350" y2="246" class="stop"/>
  <text x="350" y="148" text-anchor="middle" class="sub">aperture stop</text>
  <line x1="160" y1="174" x2="160" y2="226" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" class="lblb" fill="#7c3aed">EP</text>
  <line x1="590" y1="174" x2="590" y2="226" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="166" text-anchor="middle" class="lblb" fill="#7c3aed">XP</text>
  <line x1="40" y1="200" x2="40" y2="130" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="216" text-anchor="middle" class="lbl">object</text>
  <line x1="40.0" y1="200.0" x2="250.0" y2="180.8" class="ray-r"/>
  <line x1="250.0" y1="180.8" x2="350.0" y2="171.6" class="ray-r"/>
  <line x1="350.0" y1="171.6" x2="480.0" y2="183.5" class="ray-r"/>
  <line x1="480.0" y1="183.5" x2="660.0" y2="200.0" class="ray-r" marker-end="url(#arr-red)"/>
  <circle cx="90" cy="192" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="90" y="196" text-anchor="middle" class="lblb" fill="#92400e">1</text>
  <text x="108" y="196" class="sub">marginal ray: from axis to the edge of the stop</text>
  <line x1="40.0" y1="130.0" x2="250.0" y2="177.4" class="ray-g"/>
  <line x1="250.0" y1="177.4" x2="350.0" y2="200.0" class="ray-g"/>
  <line x1="350.0" y1="200.0" x2="480.0" y2="223.1" class="ray-g"/>
  <line x1="480.0" y1="223.1" x2="660.0" y2="255.0" class="ray-g" marker-end="url(#arr-green)"/>
  <circle cx="90" cy="120" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="90" y="124" text-anchor="middle" class="lblb" fill="#92400e">2</text>
  <text x="108" y="124" class="sub">chief ray: from edge of field through centre of stop</text>
  <line x1="250.0" y1="177.4" x2="345.0" y2="200.0" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="350.0" y1="200.0" x2="355.0" y2="200.0" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <line x1="355.0" y1="200.0" x2="480.0" y2="223.1" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="299.99999999999994" cy="170" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="299.99999999999994" y="174" text-anchor="middle" class="lblb" fill="#92400e">3</text>
  <text x="317.99999999999994" y="174" class="sub">extend chief ray ⇒ axis crossing on object side = EP</text>
  <circle cx="415.0" cy="236" r="11" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
  <text x="415.0" y="240" text-anchor="middle" class="lblb" fill="#92400e">4</text>
  <text x="433.0" y="240" class="sub">extend chief ray ⇒ axis crossing on image side = XP</text>
  <rect x="20" y="290" width="260" height="52" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="30" y1="301" x2="56" y2="301" stroke="#b91c1c" stroke-width="2"/>
  <text x="62" y="304" class="sub">Marginal ray (limits beam through stop)</text>
  <line x1="30" y1="315" x2="56" y2="315" stroke="#15803d" stroke-width="2"/>
  <text x="62" y="318" class="sub">Chief ray (through centre of stop, EP, XP)</text>
  <line x1="30" y1="329" x2="56" y2="329" stroke="#6b7280" stroke-width="2"/>
  <text x="62" y="332" class="sub">Dashed: chief-ray extensions to find EP and XP</text>
</svg>
