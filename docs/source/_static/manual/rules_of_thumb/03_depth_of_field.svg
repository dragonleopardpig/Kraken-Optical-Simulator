<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Depth of field    DoF ≈ 2 N c (1 + |m|) / m²</text>
  <text x="360" y="40" text-anchor="middle" class="sub">circle of confusion c sets the acceptable-blur tolerance on the sensor</text>
  <line x1="40" y1="200" x2="680" y2="200" class="axis"/>
  <path d="M 360 110 C 352 155.0, 352 245.0, 360 290 C 368 245.0, 368 155.0, 360 110 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="354,113 360,104 366,113" fill="#0ea5e9"/>
  <polygon points="354,287 360,296 366,287" fill="#0ea5e9"/>
  <path d="M 360 110 L 560 200 L 360 290 Z" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8"/>
  <path d="M 360 110 L 520 188 L 520 212 L 360 290 Z" fill="#b91c1c" fill-opacity="0.10" stroke="#b91c1c" stroke-dasharray="4,3"/>
  <path d="M 360 110 L 620 188 L 620 212 L 360 290 Z" fill="#b91c1c" fill-opacity="0.10" stroke="#b91c1c" stroke-dasharray="4,3"/>
  <circle cx="560" cy="200" r="3" fill="#0f766e"/>
  <text x="560" y="186" text-anchor="middle" class="lblb">in-focus</text>
  <text x="520" y="236" text-anchor="middle" class="lbl">near limit</text>
  <text x="620"  y="236" text-anchor="middle" class="lbl">far limit</text>
  <line x1="520" y1="290" x2="620" y2="290" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="570" y="305" text-anchor="middle" class="lblb">DoF</text>
  <text x="360" y="60" text-anchor="middle" class="lbl">distant focus  →  hyperfocal  H ≈ f² / (N c) + f      DoF behind ≈ 2× DoF in front (for moderate s)</text>
</svg>
