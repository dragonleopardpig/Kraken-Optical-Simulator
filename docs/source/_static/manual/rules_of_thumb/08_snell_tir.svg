<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Snell:  n₁ sin θ₁ = n₂ sin θ₂        TIR:  θ_c = arcsin(n₂ / n₁)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">(only when n₁ > n₂)</text>
  <rect x="40" y="230" width="640" height="130" fill="#0ea5e9" fill-opacity="0.08" stroke="none"/>
  <line x1="40" y1="230" x2="680" y2="230" stroke="#111827" stroke-width="1.4"/>
  <text x="670" y="222" text-anchor="end" class="lbl">n₁ (lower)</text>
  <text x="670" y="246" text-anchor="end" class="lbl">n₂ &gt; n₁  (glass)</text>
  <text x="670" y="222" text-anchor="end" class="lbl">                                       n₁ (medium 1)</text>
  <line x1="280" y1="130" x2="280" y2="330" class="dash"/>
  <line x1="215.0" y1="117.4" x2="280" y2="230" class="ray" marker-end="url(#arrR)"/>
  <text x="209.0" y="113.4" text-anchor="end" class="lblb">incident</text>
  <line x1="280" y1="230" x2="320.2" y2="353.6" class="rayA"/>
  <text x="324.2" y="353.6" class="lblb" fill="#7c3aed">refracted</text>
  <line x1="280" y1="230" x2="345.0" y2="117.4" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="349.0" y="117.4" class="lbl" fill="#b45309">reflected</text>
  <path d="M 258 198 A 22 22 0 0 1 280 204" stroke="#111827" fill="none"/>
  <text x="250" y="212" class="lbl">θ₁</text>
  <path d="M 302 260 A 22 22 0 0 1 280 252" stroke="#111827" fill="none"/>
  <text x="298" y="252" class="lbl">θ₂</text>
  <text x="360" y="360" text-anchor="middle" class="sub">glass→air (n₁=1.5): θ_c ≈ 41.8°         water→air (n₁=1.33): θ_c ≈ 48.6°</text>
</svg>
