      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">Pixel sampling — Nyquist  ν_pix = 1 / (2 p)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">match optical resolution to pixel pitch p (sensor side)</text>
  <rect x="80" y="80" width="580" height="200" fill="none" stroke="#6b7280"/>
  <text x="370" y="302" text-anchor="middle" class="lbl">spatial frequency  ν  [cyc/mm]</text>
  <text x="60" y="180" text-anchor="middle" class="lbl" transform="rotate(-90 60 180)">MTF</text>
  <polyline points="80.0,100.0 93.5,104.5 107.0,109.0 120.5,113.5 134.0,118.0 147.5,122.5 161.0,127.0 174.5,131.5 188.0,136.0 201.5,140.5 215.0,145.0 228.5,149.5 242.0,154.0 255.5,158.5 269.0,163.0 282.5,167.5 296.0,172.0 309.5,176.5 323.0,181.0 336.5,185.5 350.0,190.0 363.5,194.5 377.0,199.0 390.5,203.5 404.0,208.0 417.5,212.5 431.0,217.0 444.5,221.5 458.0,226.0 471.5,230.5 485.0,235.0 498.5,239.5 512.0,244.0 525.5,248.5 539.0,253.0 552.5,257.5 566.0,262.0 579.5,266.5 593.0,271.0 606.5,275.5 620.0,280.0" stroke="#1d4ed8" stroke-width="2.2" fill="none"/>
  <line x1="620" y1="280" x2="620" y2="80" class="dash"/>
  <text x="624" y="94" class="lblb">ν_c = 1/(λN)</text>
  <line x1="323.0" y1="280" x2="323.0" y2="80" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="327.0" y="112" class="lblb" fill="#b91c1c">ν_pix = 1/(2p)</text>
  <text x="360" y="335" text-anchor="middle" class="sub">good rule:  N ≈ p / (λ · k)  with k ≈ 1–2   →   pixel ≈ Airy radius for diffraction-limited match</text>
</svg>
