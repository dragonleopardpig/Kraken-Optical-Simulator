<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrEnv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .ttl   { fill:#111827; font-size:16px; font-weight:700; }
      .sub   { fill:#374151; font-size:11.5px; }
      .lbl   { fill:#111827; font-size:12px; }
      .lblb  { fill:#111827; font-size:12px; font-weight:700; }
      .axis  { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,4; }
      .dash  { stroke:#9ca3af; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .ray   { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .rayA  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .env   { stroke:#b45309; stroke-width:2; fill:none; }
      .envf  { fill:#b45309; fill-opacity:0.10; stroke:none; }
      .acc   { stroke:#0f766e; stroke-width:1.8; fill:none; }
      .warn  { stroke:#b91c1c; stroke-width:1.6; fill:none; }
      .lens  { stroke:#0ea5e9; stroke-width:2.2; fill:#0ea5e9; fill-opacity:0.10; }
      .mir   { stroke:#475569; stroke-width:2.4; fill:none; }
    </style>
  </defs>
  <text x="360" y="22" text-anchor="middle" class="ttl">1:1 macro rule    s = s' = 2f    (between principal planes)</text>
  <text x="360" y="40" text-anchor="middle" class="sub">working distance ≈ 2f − front-vertex offset ;  W.D. ≈ f(1 + 1/m)  for m &lt; 1</text>
  <line x1="40" y1="200" x2="680" y2="200" class="axis"/>
  <path d="M 360 130 C 352 165.0, 352 235.0, 360 270 C 368 235.0, 368 165.0, 360 130 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="354,133 360,124 366,133" fill="#0ea5e9"/>
  <polygon points="354,267 360,276 366,267" fill="#0ea5e9"/>
  <line x1="180" y1="200" x2="180" y2="150" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="140" text-anchor="middle" class="lblb">y</text>
  <line x1="540" y1="200" x2="540" y2="250" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="264" text-anchor="middle" class="lblb">y' = −y</text>
  <path d="M 180 150 L 360 150 L 540 250" class="ray"/>
  <path d="M 180 150 L 540 250" class="rayA"/>
  <line x1="180" y1="305" x2="360" y2="305" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="270" y="320" text-anchor="middle" class="lblb">s = 2f</text>
  <line x1="360" y1="305" x2="540" y2="305" stroke="#111827" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="450" y="320" text-anchor="middle" class="lblb">s' = 2f</text>
  <text x="360" y="350" text-anchor="middle" class="sub">working F-number  N_w = N (1 + |m|) = 2N  at 1:1   →   doubles effective f-number</text>
</svg>
