<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .image-plane { stroke:#111; stroke-width:2.5; }
      .ray   { stroke:#2563eb; stroke-width:1.1; fill:none; }
      .obj   { fill:#dc2626; }
      .key   { stroke:#dc2626; stroke-width:1.6; fill:none; }
      .key-text { fill:#dc2626; font-size:13px; font-weight:700; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" class="ttl">Object-Space Telecentric (Machine-Vision Signature Design)</text>

  <line x1="30" y1="190" x2="780" y2="190" class="ax"/>

  <!-- ===== Static elements (object plane, lenses, stop, sensor) drawn first ===== -->

  <!-- Object plane and three object points -->
  <line x1="60" y1="100" x2="60" y2="280" stroke="#111" stroke-width="2"/>
  <text x="60" y="92" text-anchor="middle" class="label">object plane</text>
  <circle cx="60" cy="120" r="3.5" class="obj"/>
  <circle cx="60" cy="190" r="3.5" class="obj"/>
  <circle cx="60" cy="260" r="3.5" class="obj"/>

  <!-- LARGE front lens at cx=210, h=90 (with edge thickness) -->
  <path d="M 206,100 L 214,100 A 200,200 0 0,1 214,280 L 206,280 A 200,200 0 0,1 206,100 Z" class="pos"/>

  <!-- Aperture stop at x=340 -->
  <line x1="340" y1="120" x2="340" y2="170" class="stop"/>
  <line x1="340" y1="210" x2="340" y2="260" class="stop"/>
  <text x="340" y="110" text-anchor="middle" class="label">aperture stop  =  F&#x2032; of front lens</text>

  <!-- Rear lens at cx=510, h=55 (with edge thickness) -->
  <path d="M 506,135 L 514,135 A 130,130 0 0,1 514,245 L 506,245 A 130,130 0 0,1 506,135 Z" class="pos"/>

  <!-- Sensor (image) plane -->
  <line x1="690" y1="140" x2="690" y2="240" class="image-plane"/>
  <text x="690" y="132" text-anchor="middle" class="label">sensor</text>

  <!-- ===== All chief rays drawn AFTER lenses so they stay continuous on top ===== -->

  <!-- Object-space chief rays: parallel to axis from object plane to front lens -->
  <line x1="60" y1="120" x2="210" y2="120" class="ray"/>
  <line x1="60" y1="190" x2="210" y2="190" class="ray"/>
  <line x1="60" y1="260" x2="210" y2="260" class="ray"/>

  <!-- After front lens, rays converge to stop centre at (340, 190) = F' of front lens -->
  <line x1="210" y1="120" x2="340" y2="190" class="ray"/>
  <line x1="210" y1="190" x2="340" y2="190" class="ray"/>
  <line x1="210" y1="260" x2="340" y2="190" class="ray"/>

  <!-- After stop, rays diverge to rear lens -->
  <line x1="340" y1="190" x2="510" y2="150" class="ray"/>
  <line x1="340" y1="190" x2="510" y2="190" class="ray"/>
  <line x1="340" y1="190" x2="510" y2="230" class="ray"/>

  <!-- After rear lens, rays converge to image points on sensor -->
  <line x1="510" y1="150" x2="690" y2="160" class="ray"/>
  <line x1="510" y1="190" x2="690" y2="190" class="ray"/>
  <line x1="510" y1="230" x2="690" y2="220" class="ray"/>

  <!-- ==== Annotations highlighting the distinctive feature ==== -->

  <!-- KEY: parallel chief rays in object space — bounding box ends at front-lens centreline -->
  <rect x="55" y="95" width="155" height="200" class="annot" stroke-dasharray="5,3"/>
  <text x="135" y="58" text-anchor="middle" class="annot-text">Object-space chief rays</text>
  <text x="135" y="74" text-anchor="middle" class="annot-text">parallel to optical axis</text>
  <line x1="135" y1="78" x2="135" y2="92" class="annot" marker-end="url(#arr)"/>

  <!-- Stop-at-F' callout -->
  <text x="370" y="320" class="annot-text">Stop placed at the rear focal point F&#x2032; of the front lens</text>

  <!-- Front element ≥ FOV callout -->
  <line x1="180" y1="100" x2="180" y2="280" class="key" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="240" y="295" class="key-text">front element diameter ≥ field of view</text>

  <!-- Bottom emphasis -->
  <text x="400" y="345" text-anchor="middle" class="annot-text">
    Magnification independent of object distance ⇒ used for non-contact dimensional measurement
  </text>
</svg>
