<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .neg   { fill:#fecaca; stroke:#991b1b; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .cement{ stroke:#111; stroke-width:0.7; }
      .surf  { stroke:#dc2626; stroke-width:2.4; fill:none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <!-- Clip paths so internal fills/lines stay inside each lens shape -->
    <clipPath id="tripletShape">
      <path d="M 250,108 A 100,100 0 0,1 250,232 A 100,100 0 0,1 250,108 Z"/>
    </clipPath>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="ttl">Sonnar</text>

  <line x1="30" y1="170" x2="690" y2="170" class="ax"/>

  <!-- Front positive singlet -->
  <path d="M 130,115 A 130,130 0 0,1 130,225 A 130,130 0 0,1 130,115 Z" class="pos"/>

  <!-- Cemented triplet (pos | neg | pos), drawn as one biconvex with two clipped cement strips -->
  <g clip-path="url(#tripletShape)">
    <rect x="140" y="100" width="240" height="140" fill="#bfdbfe"/>
    <rect x="243" y="100" width="14"  height="140" fill="#fecaca"/>
    <line x1="243" y1="100" x2="243" y2="240" class="cement"/>
    <line x1="257" y1="100" x2="257" y2="240" class="cement"/>
  </g>
  <!-- Triplet outline drawn on top -->
  <path d="M 250,108 A 100,100 0 0,1 250,232 A 100,100 0 0,1 250,108 Z"
        fill="none" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Stop -->
  <line x1="370" y1="115" x2="370" y2="155" class="stop"/>
  <line x1="370" y1="185" x2="370" y2="225" class="stop"/>
  <text x="370" y="105" text-anchor="middle" class="label">aperture stop</text>

  <!-- Thick cemented doublet (pos | neg), R=110 -->
  <path d="M 470,110 A 110,110 0 0,1 470,230 A 110,110 0 0,1 470,110 Z" class="pos"/>
  <path d="M 470,110 A 110,110 0 0,1 470,230 L 470,110 Z" class="neg"/>
  <line x1="470" y1="110" x2="470" y2="230" class="cement"/>

  <!-- Element labels -->
  <text x="130" y="260" text-anchor="middle" class="label">positive crown</text>
  <text x="250" y="260" text-anchor="middle" class="label">cemented triplet (+,−,+)</text>
  <text x="470" y="260" text-anchor="middle" class="label">cemented doublet</text>

  <!-- Mark every air-glass surface in red. Internal cement faces (glass-glass) are NOT marked. -->
  <!-- Front singlet: 2 air-glass surfaces -->
  <path d="M 130,115 A 130,130 0 0,1 130,225" class="surf"/>
  <path d="M 130,115 A 130,130 0 0,0 130,225" class="surf"/>
  <!-- Triplet: 2 air-glass surfaces (front + back) -->
  <path d="M 250,108 A 100,100 0 0,1 250,232" class="surf"/>
  <path d="M 250,108 A 100,100 0 0,0 250,232" class="surf"/>
  <!-- Rear doublet: 2 air-glass surfaces -->
  <path d="M 470,110 A 110,110 0 0,1 470,230" class="surf"/>
  <path d="M 470,110 A 110,110 0 0,0 470,230" class="surf"/>

  <!-- Annotation -->
  <text x="360" y="285" text-anchor="middle" class="annot-text">
    Thick cemented groups ⇒ only 6 air–glass surfaces (red) vs. 8+ in a Double Gauss
  </text>

  <!-- Legend -->
  <rect x="30" y="300" width="14" height="10" class="pos"/>
  <text x="48" y="309" class="label">positive (converging)</text>
  <rect x="190" y="300" width="14" height="10" class="neg"/>
  <text x="208" y="309" class="label">negative (diverging)</text>
  <line x1="360" y1="305" x2="380" y2="305" class="surf"/>
  <text x="385" y="309" class="label">air–glass surface</text>
</svg>
