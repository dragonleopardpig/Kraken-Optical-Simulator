<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .neg   { fill:#fecaca; stroke:#991b1b; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .image-plane { stroke:#111; stroke-width:2.5; }
      .dim   { stroke:#dc2626; stroke-width:1.4; fill:none; }
      .dim-text { fill:#dc2626; font-size:12px; font-weight:700; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="ttl">Retrofocus (Inverted Telephoto)</text>

  <line x1="30" y1="170" x2="690" y2="170" class="ax"/>

  <!-- Front NEGATIVE group: 2 elements -->
  <path d="M 110,115 L 130,115 A 180,180 0 0,0 130,225 L 110,225 A 180,180 0 0,0 110,115 Z" class="neg"/>
  <path d="M 175,115 L 195,115 A 200,200 0 0,0 195,225 L 175,225 A 200,200 0 0,0 175,115 Z" class="neg"/>

  <!-- Stop in between groups -->
  <line x1="320" y1="125" x2="320" y2="160" class="stop"/>
  <line x1="320" y1="180" x2="320" y2="215" class="stop"/>
  <text x="320" y="115" text-anchor="middle" class="label">stop</text>

  <!-- Rear POSITIVE group: 2 elements -->
  <path d="M 425,115 A 140,140 0 0,1 425,225 A 140,140 0 0,1 425,115 Z" class="pos"/>
  <path d="M 495,115 A 150,150 0 0,1 495,225 A 150,150 0 0,1 495,115 Z" class="pos"/>

  <!-- Image plane -->
  <line x1="640" y1="120" x2="640" y2="220" class="image-plane"/>
  <text x="640" y="112" text-anchor="middle" class="label">image plane</text>

  <!-- Group labels -->
  <text x="150" y="98" text-anchor="middle" class="annot-text">negative front group</text>
  <text x="460" y="98" text-anchor="middle" class="annot-text">positive rear group</text>

  <!-- Back focal distance dimension (last vertex to image plane) -->
  <line x1="510" y1="248" x2="640" y2="248" class="dim" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="575" y="266" text-anchor="middle" class="dim-text">back focal distance (BFD)</text>

  <!-- Effective focal length dimension (rear principal plane to image) — schematic -->
  <line x1="430" y1="285" x2="640" y2="285" class="dim" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="535" y="302" text-anchor="middle" class="dim-text">effective focal length (EFFL)</text>

  <!-- Bottom emphasis -->
  <text x="360" y="55" text-anchor="middle" class="annot-text">BFD &gt; EFFL ⇒ wide-angle lens with enough back-focus to clear an SLR mirror</text>
</svg>
