<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .ax    { stroke:#6b7280; stroke-width:1; stroke-dasharray:5,3; fill:none; }
      .pos   { fill:#bfdbfe; stroke:#1e3a8a; stroke-width:1.5; }
      .neg   { fill:#fecaca; stroke:#991b1b; stroke-width:1.5; }
      .stop  { stroke:#111827; stroke-width:2.5; fill:none; }
      .annot { stroke:#15803d; stroke-width:1.6; fill:none; }
      .annot-text { fill:#15803d; font-size:13px; font-weight:700; }
      .label { fill:#374151; font-size:11px; }
      .ttl   { fill:#111827; font-size:18px; font-weight:700; }
      .image-plane { stroke:#111; stroke-width:2.5; }
      .dim   { stroke:#dc2626; stroke-width:1.4; fill:none; }
      .dim-text { fill:#dc2626; font-size:12px; font-weight:700; }
      .dimB  { stroke:#7c3aed; stroke-width:1.4; fill:none; }
      .dimB-text { fill:#7c3aed; font-size:12px; font-weight:700; }
    </style>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="ttl">Telephoto</text>

  <line x1="30" y1="170" x2="690" y2="170" class="ax"/>

  <!-- Front POSITIVE group: 2 elements -->
  <path d="M 130,115 A 130,130 0 0,1 130,225 A 130,130 0 0,1 130,115 Z" class="pos"/>
  <path d="M 200,115 A 140,140 0 0,1 200,225 A 140,140 0 0,1 200,115 Z" class="pos"/>

  <!-- Rear NEGATIVE group: 1 element, close to front group -->
  <path d="M 290,115 L 310,115 A 180,180 0 0,0 310,225 L 290,225 A 180,180 0 0,0 290,115 Z" class="neg"/>

  <!-- Image plane -->
  <line x1="610" y1="120" x2="610" y2="220" class="image-plane"/>
  <text x="610" y="112" text-anchor="middle" class="label">image plane</text>

  <!-- Group labels -->
  <text x="165" y="98" text-anchor="middle" class="annot-text">positive front group</text>
  <text x="305" y="98" text-anchor="middle" class="annot-text">negative rear group</text>

  <!-- Physical length: front vertex to image plane -->
  <line x1="120" y1="248" x2="610" y2="248" class="dimB" marker-start="url(#arrV)" marker-end="url(#arrV)"/>
  <text x="365" y="266" text-anchor="middle" class="dimB-text">physical length (front vertex to sensor)</text>

  <!-- Effective focal length: longer than physical length -->
  <line x1="50"  y1="288" x2="610" y2="288" class="dim" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="330" y="305" text-anchor="middle" class="dim-text">effective focal length (EFFL) — longer than the lens itself</text>

  <!-- Top emphasis -->
  <text x="360" y="55" text-anchor="middle" class="annot-text">Positive front + negative rear ⇒ EFFL &gt; physical length (a long lens that fits in a short barrel)</text>
</svg>
